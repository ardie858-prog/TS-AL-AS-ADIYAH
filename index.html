/* ===== Live search santri: ketik nama langsung tampil berjejer ===== */
function liveSantriSug(q,list,onPick,max=12){
  q=(q||'').trim().toLowerCase();
  if(!q)return '';
  const m=(list||[]).filter(s=>String(s.nama||'').toLowerCase().includes(q)||String(s.nis||'').toLowerCase().includes(q)||String(s.kamar||'').toLowerCase().includes(q)).slice(0,max);
  if(!m.length)return `<div class="livesug"><div class="sg mu" style="cursor:default">Tidak ada santri yang cocok</div></div>`;
  return `<div class="livesug">${m.map(s=>`<div class="sg" onclick="${onPick(s)}"><span><b>${esc(s.nama)}</b><div class="mu">${[s.nis&&'NIS '+s.nis,s.kamar,s.kelas].filter(Boolean).map(esc).join(' · ')||'-'}</div></span></div>`).join('')}</div>`;
}
function liveFilterList(q,list,keys){
  q=(q||'').trim().toLowerCase();
  if(!q)return list;
  return list.filter(x=>keys.some(k=>{const v=k.split('.').reduce((o,p)=>o&&o[p],x);return String(v??'').toLowerCase().includes(q)}));
}

    }catch(e){}

    }
    if(!pwSaved){
      // Pertama kali login: tetapkan sandi ini
      try{await SB.from('konten').upsert({kunci:'alumni_sandi_'+String(nis),nilai:pwAl,diubah:new Date().toISOString()})}catch(e){}
      try{localStorage.setItem('st_al_pw_'+String(nis),pwAl)}catch(e){}
    }else if(pwSaved!==String(pwAl)){
      b.disabled=false;return msgBox('Kata sandi alumni salah.');
    }else{
      try{localStorage.setItem('st_al_pw_'+String(nis),pwAl)}catch(e){}
      try{await SB.from('konten').upsert({kunci:'alumni_sandi_'+String(nis),nilai:pwAl,diubah:new Date().toISOString()})}catch(e){}
    }
    }
    sessionStorage.setItem('st_alumni',JSON.stringify(al));
    sessionStorage.setItem('st_sesi','1');
    U={me:{role:'alumni',nama:al.nama,id:'alumni-'+al.id},tab:'home',sid:null,santri:[],allSantri:[],alumni:al,online:{}};
    await bootAlumni();
  }catch(err){b.disabled=false;msgBox(err.message||'Gagal login alumni.');}
  return;

async function bootAlumni(){
  try{
    const raw=ok(await SB.from('santri').select('*').order('nama'))||[];
    U.allSantri=raw;
    U.santri=raw.filter(isAktifSantri);

  if(!U.santri.length){

async function syncKontakPublik(){
  if(!U.me||U.me.role!=='admin')return;
  try{
    const profs=ok(await SB.from('profiles').select('id,nama,role,is_utama').eq('role','admin').order('nama'))||[];
    if(profs.length)await SB.from('konten').upsert({kunci:'admin_kontak',nilai:profs,diubah:new Date().toISOString()});
    const al=(U.allSantri||[]).filter(x=>x.alumni).map(x=>({id:x.id,nama:x.nama,nis:x.nis,angkatan:x.angkatan,tahun_lulus:x.tahun_lulus,alamat:x.alamat}));
    await SB.from('konten').upsert({kunci:'alumni_kontak',nilai:al,diubah:new Date().toISOString()});
  }catch(e){}
}

async function boot(){
  const alRaw=sessionStorage.getItem('st_alumni');
  if(alRaw){
    try{
      const al=JSON.parse(alRaw);
      U={me:{role:'alumni',nama:al.nama,id:'alumni-'+al.id},tab:'home',sid:null,santri:[],allSantri:[],alumni:al,online:{}};
      await bootAlumni();return;
    }catch(e){sessionStorage.removeItem('st_alumni')}
  }
  if(localStorage.getItem('st_ingat')==='0'&&!sessionStorage.getItem('st_sesi'))await SB.auth.signOut();
  const{data:{session}}=await SB.auth.getSession();if(!session)return loginView();
  if(!(await mfaWajibJikaAda())){await SB.auth.signOut();return loginView()}
  const{data:me}=await SB.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!me){await SB.auth.signOut();loginView();return msgBox('Profil akun tidak ditemukan.')}
  me.email=session.user.email||me.email||'';
  U.me=me;
  const rawSantri=ok(await SB.from('santri').select('*').order('nama'))||[];
  U.allSantri=rawSantri;
  U.santri=rawSantri.filter(isAktifSantri);
  U.sid=U.santri[0]?.id||null;U.tab='home';U.online=U.online||{};
  draw();startRealtimePresence();startJam();if(U.me.role==='admin'){syncKontakPublik();setTimeout(cekBackupOtomatis,2500)}
}

const PROFIL_FOTO_URL=(uid,t)=>'https://mkbpucoojmeiuhhjvgrg.supabase.co/storage/v1/object/public/aset/profil-'+uid+'.jpg?v='+(t||Math.floor(Date.now()/6e4));
const blobToDataUrl=bl=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Gagal membaca gambar'));r.readAsDataURL(bl)});
async function getMyAvatarUrl(){
  if(!U.me)return '';
  if(U.me.role==='wali'){

      const fo=await getFotos([s]);
      return fotoDariMap(fo,s.foto_path)||'';
    }
    return '';
  }
  if(U.me.role==='alumni'){
    const loc=localStorage.getItem('st_pf_'+U.me.id);
    if(loc)return loc;
    const u=PROFIL_FOTO_URL(U.me.id);
    if(await okImg(u))return u;
    try{
      const{data}=await SB.from('konten').select('nilai').eq('kunci','profil_foto_'+U.me.id).maybeSingle();
      if(data&&data.nilai){localStorage.setItem('st_pf_'+U.me.id,data.nilai);return data.nilai}

        const smallBl=await jpgBlob(f,280);

async function ajukan(){const a=$('al').value.trim(),b=$('bt').value;if(!a||!b)return msgBox('Isi alasan dan batas kembali.');const{error}=await SB.from('izin').insert({santri_id:U.sid,alasan:a,batas_kembali:new Date(b).toISOString()});if(error)return msgBox(error.message);toast('Pengajuan izin dikirim.');draw()}
async function ajukanStaff(){const sid=+$('iz_sid').value,a=$('al').value.trim(),b=$('bt').value,st=$('iz_st').value;if(!sid)return msgBox('Pilih santri terlebih dahulu.');if(!a||!b)return msgBox('Isi alasan dan batas kembali.');const p={santri_id:sid,alasan:a,batas_kembali:new Date(b).toISOString(),status:st};if(st=='keluar')p.waktu_keluar=new Date().toISOString();const{error}=await SB.from('izin').insert(p);if(error)return msgBox(error.message);toast('Data izin santri berhasil ditambahkan.');draw()}
async function simpanEditIzin(id){const a=$('ed_al_'+id).value.trim(),b=$('ed_bt_'+id).value,st=$('ed_st_'+id).value;if(!a||!b)return msgBox('Alasan dan batas kembali tidak boleh kosong.');const p={alasan:a,batas_kembali:new Date(b).toISOString(),status:st};if(st=='keluar')p.waktu_keluar=new Date().toISOString();const{error}=await SB.from('izin').update(p).eq('id',id);if(error)return msgBox(error.message);U.ize=null;toast('Perubahan izin disimpan.');draw()}
async function izs(id,s){const p={status:s};if(s=='keluar')p.waktu_keluar=new Date().toISOString();const{error}=await SB.from('izin').update(p).eq('id',id);if(error)return msgBox(error.message);toast('Status izin diperbarui: '+s);draw()}
async function kembali(id){const{data,error}=await SB.rpc('santri_kembali',{p_izin:id});if(error)return msgBox(error.message);if(data>0)msgBox('Telat '+data+' menit, tercatat sebagai pelanggaran.');else toast('Santri dikonfirmasi telah kembali tepat waktu.');draw()}

R.info0=async()=>{const[a,b]=(await Promise.all([SB.from('acara').select('*').gte('waktu',new Date(Date.now()-864e5).toISOString()).order('waktu').limit(20),SB.from('pengumuman').select('*').order('waktu',{ascending:false}).limit(10)])).map(ok),td=new Date(new Date().toISOString().slice(0,10));

R.absensi=async()=>`<div class="card"><h3>Absensi kegiatan</h3><select id="kg">${KG.map((k,i)=>`<option value="${i}">${k[0]}</option>`).join('')}</select><p class="mu">Centang santri yang telat/tidak hadir. Yang tidak dicentang dianggap hadir.</p>${U.santri.map(s=>`<label class="ck"><input type="checkbox" class="cb" value="${s.id}"> ${esc(s.nama)} <span class="mu">${esc(s.kamar||'')}</span></label>`).join('')}<p><button onclick="absen()">Simpan absensi</button></p></div><div class="card"><h3>Catat pelanggaran lain</h3><label>Santri</label><select id="ps" style="width:100%">${U.santri.map(s=>`<option value="${s.id}">${esc(s.nama)}</option>`).join('')}</select><div class="srwrap"><button type="button" class="sec srbtn" onclick="srOpen('ps','Cari santri untuk catat pelanggaran')"><i class="fa-solid fa-magnifying-glass"></i> Cari santri…</button></div><label>Jenis</label><select id="pj" style="width:100%">${Object.entries(JN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label>Keterangan</label><textarea id="pk" rows="2" style="width:100%"></textarea><p><button onclick="catat()">Simpan</button></p></div>`;

R.kasir=async()=>`<div class="card"><h3>Kasir QR</h3><label>Kode QR santri</label><div class="row" style="flex-wrap:nowrap"><input id="kc" list="dl" style="flex:1;min-width:0" placeholder="PPPAS-1"><button type="button" class="sec" onclick="scanQR()" title="Scan QR dengan kamera"><i class="fa-solid fa-camera"></i></button></div><datalist id="dl">${U.santri.map(s=>`<option value="PPPAS-${s.id}">${esc(s.nama)}</option>`).join('')}</datalist><label>Jenis</label><select id="kj" style="width:100%"><option value="belanja">Pembelian / pengeluaran (potong coin)</option>${U.me.role=='admin'?'<option value="topup">Tambah coin manual (admin)</option>':''}</select><label>Nominal (Rp)</label><input id="kn" type="number" min="1" style="width:100%"><label>Keterangan</label><input id="kk" style="width:100%" placeholder="Contoh: buku kitab, kantin, fotokopi"><p><button onclick="kasir()">Proses</button></p></div>`;

/* ===== Toast antrean + badge notifikasi real-time ===== */
let _toastQ=[],_toastBusy=false,_toastEl=null;
function toast(m,opts){
  opts=opts||{};
  _toastQ.push({m:String(m||''),ms:opts.ms||4200,type:opts.type||'info'});
  if(!_toastBusy)drainToast();
}
function drainToast(){
  if(!_toastQ.length){_toastBusy=false;return}
  _toastBusy=true;
  const item=_toastQ.shift();
  if(_toastEl){_toastEl.remove();_toastEl=null}
  const d=document.createElement('div');
  const bg=item.type==='warn'?'#b45309':(item.type==='err'?'#b91c1c':'#064e3b');
  d.style.cssText=`position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:120;background:${bg};color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.3);font-size:14px;font-weight:600;transform:translateY(-12px);opacity:0;transition:transform .2s ease,opacity .2s ease`;
  d.textContent=item.m;
  document.body.appendChild(d);
  _toastEl=d;
  requestAnimationFrame(()=>{d.style.transform='translateY(0)';d.style.opacity='1'});
  setTimeout(()=>{
    d.style.opacity='0';d.style.transform='translateY(-12px)';
    setTimeout(()=>{if(d.parentNode)d.remove();if(_toastEl===d)_toastEl=null;drainToast()},220);
  },item.ms);
}
function updateNotifBadge(n){
  U.unread=Math.max(0,n|0);
  const dot=$('bdot');
  if(dot)dot.style.display=U.unread?'':'none';
  // Update bottom nav badge if present
  const bn=$('bn');
  if(bn){
    const btn=[...bn.querySelectorAll('button')].find(b=>/Notifikasi|notif/i.test(b.textContent||'')||b.querySelector('.fa-bell'));
    if(btn){
      let mb=btn.querySelector('.mb');
      if(U.unread){
        if(!mb){mb=document.createElement('b');mb.className='mb';mb.style.cssText='top:0;right:4px';btn.appendChild(mb)}
        mb.textContent=U.unread>99?'99+':String(U.unread);
      }else if(mb)mb.remove();
    }
  }
}
function bumpNotifBadge(){
  updateNotifBadge((U.unread||0)+1);
}
function playNotifSound(){
  try{
    const x=new(window.AudioContext||window.webkitAudioContext)();
    const o=x.createOscillator(),g=x.createGain();
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.001,x.currentTime);
    g.gain.exponentialRampToValueAtTime(.12,x.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,x.currentTime+.28);
    o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+.3);
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([40,30,40])}catch(e){}
}
function onRealtimeNotif(payload){
  // payload: {judul, pesan, jenis, santri_nama, id}

  const nama=payload.santri_nama||payload.nama||'';
  const txt=nama?(nama+' · '+judul):(judul+(pesan?': '+pesan.slice(0,80):''));
  bumpNotifBadge();
  playNotifSound();
  toast(txt,{type:'info',ms:5000});
  // If currently on notif tab, soft-refresh list
  if(U.tab==='notif'){
    clearTimeout(U._notifRefresh);
    U._notifRefresh=setTimeout(()=>draw(),600);
  }
}

/* ===== Menu Keamanan (admin): uji keamanan, status proteksi, kunci login, reset sandi alumni, log aktivitas ===== */
const KM_TABEL=['santri','profiles','wali_santri','transaksi','topup_request','tabungan','tagihan','pelanggaran','sanksi_santri','izin','kesehatan','konten','notifikasi','pengumuman','story','acara','pendaftar','rekap_bulan','wa_antrian'];
const KM_BOLEH_TERBUKA=['pengumuman','acara','story'];
const KM_RPC=[['semua_saldo_coin',{},'Saldo coin seluruh santri'],['saldo',{p_santri:0},'Saldo coin per santri'],['saldo_tabungan',{p_santri:0},'Saldo tabungan'],['tabungan_riwayat',{p_santri:0},'Riwayat tabungan'],['top_pelanggar',{},'Peringkat pelanggar']];
function kmIsFnMissing(e){return /PGRST202|PGRST204|42883|could not find the function|schema cache/i.test(((e&&e.code)||'')+' '+((e&&e.message)||''))}
function kmAnonClient(){return supabase.createClient(SB.supabaseUrl,SB.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'st-uji-anon'}})}
async function ujiKeamanan(){
  toast('Menguji keamanan… (±15 detik)');
  const X=kmAnonClient(),out=[];
  const add=(t,j,k)=>out.push({t,j,k:k||''});
  for(const t of KM_TABEL){
    try{
      if(t==='konten'){
        const r=await X.from('konten').select('kunci').limit(1000);
        if(r.error){add('aman','Tabel konten tertutup untuk umum');continue}
        const ks=(r.data||[]).map(x=>x.kunci||'');
        const sandi=ks.filter(k=>/sandi|password|passwd|pw_/i.test(k));
        if(sandi.length)add('bahaya','Sandi dapat dibaca publik ('+sandi.length+' data di tabel konten)','Siapa pun yang punya alamat web ini bisa membaca sandi. Pasang keamanan.sql untuk alumni; sandi wali perlu dipindahkan dari tabel konten.');
        add(ks.length?'waspada':'info','Tabel konten dapat dibaca publik ('+ks.length+' kunci)',ks.length?'Pastikan tidak ada data pribadi di dalamnya (foto profil alumni tersimpan di sini).':'Tabel kosong atau tertutup.');
        continue;
      }
      const r=await X.from(t).select('*').limit(1);
      if(r.error){add('aman','Tabel '+t+' tertutup untuk umum');continue}
      if(r.data&&r.data.length){
        const cols=Object.keys(r.data[0]);
        if(KM_BOLEH_TERBUKA.includes(t))add('info','Tabel '+t+' terbuka untuk umum','Wajar: isinya memang informasi publik.');
        else add('bahaya','Tabel '+t+' TERBUKA untuk umum','Data bisa dibaca tanpa login. Kolom: '+cols.slice(0,8).join(', ')+(cols.length>8?'…':'')+'. Perketat RLS.');
      }else add('aman','Tabel '+t+' tertutup atau kosong');
    }catch(e){add('info','Tabel '+t+' tidak bisa diuji',String(e.message||e).slice(0,80))}
  }
  for(const b of ['aset','bukti','foto']){
    try{
      const r=await X.storage.from(b).list('',{limit:3});
      if(!r.error&&r.data&&r.data.length)add('waspada','Isi bucket "'+b+'" bisa didaftar publik','Siapa pun bisa melihat daftar nama file. Batasi izin SELECT pada storage.objects.');
      else add('aman','Daftar bucket "'+b+'" tertutup');
    }catch(e){add('info','Bucket '+b+' tidak bisa diuji')}
  }
  for(const f of KM_RPC){
    try{
      const r=await X.rpc(f[0],f[1]);
      if(r.error){
        if(kmIsFnMissing(r.error))add('aman',f[2]+' tidak bisa dipanggil publik');
        else if(/denied|berhak|authoriz|policy|jwt|izin|login|ditolak|akses|admin/i.test(r.error.message||''))add('aman',f[2]+' ditolak untuk umum');
        else add('info',f[2]+' tidak bisa diuji',String(r.error.message||'').slice(0,80));
      }else{
        const d=r.data,ada=Array.isArray(d)?d.length>0:(d!==null&&d!==undefined);
        if(Array.isArray(d)&&d.length)add('bahaya',f[2]+' TERBUKA untuk umum','Fungsi '+f[0]+' mengembalikan data tanpa login.');
        else if(ada)add('waspada',f[2]+': fungsi menjawab tanpa login','Tidak ada pengecekan hak akses di dalam fungsi '+f[0]+' (jawaban untuk ID uji: '+JSON.stringify(d).slice(0,30)+').');
        else add('aman',f[2]+' tidak memberi data ke umum');
      }
    }catch(e){add('info',f[2]+' tidak bisa diuji')}
  }
  out.push({t:'info',j:'Fungsi yang mengubah data tidak diuji',k:'setujui_topup, admin_set_coin, kasir_proses, reset_sandi, dll. sengaja tidak dipanggil agar aman. Pastikan masing-masing memeriksa hak akses di dalamnya.'});
  U._kmUji={waktu:new Date().toISOString(),hasil:out};
  draw();
}

function kmRingkasLog(x){
  const d=x.detail||{};
  const cut=v=>{let s=(v!==null&&typeof v==='object')?JSON.stringify(v):String(v);return s.length>40?s.slice(0,40)+'…':s};
  if(x.aksi==='UPDATE')return Object.keys(d).slice(0,4).map(k=>k+': '+cut((d[k]||{}).lama)+' → '+cut((d[k]||{}).baru)).join('; ');
  return Object.keys(d).filter(k=>d[k]!==null&&d[k]!=='').slice(0,4).map(k=>k+': '+cut(d[k])).join('; ');
}

/* ---- Tiket login alumni: panggil fungsi data alumni dengan tiket; mode lama hanya bila SQL tiket belum dipasang ---- */
function alTiketHabis(detail){
  if(U&&U._alHabis)return;
  if(U)U._alHabis=true;
  setTimeout(async()=>{
    try{await logout()}catch(e){}
    msgBox('Sesi alumni berakhir atau tiket tidak berlaku (mis. akun ini baru masuk di perangkat lain). Silakan masuk kembali.'+(detail?' ['+String(detail).slice(0,90)+']':''));
  },0);
}
async function alRpc(fn,args,legacyArgs){
  if(U&&U._alHabis)return{data:null,error:{message:'Sesi berakhir'}};
  const tk=(U.alumni&&U.alumni.tiket)||'';
  if(tk){
    const r=await SB.rpc(fn,{...args,p_tiket:tk});
    if(!r.error)return r;
    if(/Tiket/i.test(r.error.message||'')){alTiketHabis(r.error.message);return r}
    if(!kmIsFnMissing(r.error))return r;
  }
  const r2=await SB.rpc(fn,legacyArgs);
  if(r2.error&&kmIsFnMissing(r2.error)&&!tk&&U.me&&U.me.role==='alumni')alTiketHabis('sesi lama tanpa tiket');
  return r2;
}

/* ---- Cadangan data & pembersihan sandi wali ---- */
function bersihkanSandiWali(){
  uiConfirm('Hapus semua sandi wali yang tersimpan (di profil dan penyimpanan)? Wali tetap bisa masuk dengan sandinya. Setelah ini admin tidak bisa lagi melihat sandi wali.',async()=>{
    toast('Membersihkan…');
    let n=0,err='';
    try{
      const r=await SB.from('profiles').select('id').eq('role','wali');
      const ids=(r.data||[]).map(x=>x.id);
      for(let i=0;i<ids.length;i+=50){
        const d=await SB.storage.from('bukti').remove(ids.slice(i,i+50).map(id=>id+'/sandi.txt'));
        if(d.error)err=d.error.message;
      }
      const u=await SB.from('profiles').update({sandi_wali:null}).eq('role','wali');
      if(u.error&&!/sandi_wali|column/i.test(u.error.message||''))err=u.error.message;
      n=ids.length;
    }catch(e){err=e.message||String(e)}
    msgBox(err?'Selesai sebagian. Catatan: '+err:'Selesai. Sandi tersimpan untuk '+n+' akun wali sudah dihapus.');
    draw();
  });
}

/* ===== Keamanan lanjutan: catatan kesalahan, verifikasi dua langkah (admin), audit database ===== */
function kmCatatError(msg,tab){
  msg=String(msg||'');
  if(/ResizeObserver|Script error|Non-Error promise rejection/i.test(msg))return;
  try{
    const a=JSON.parse(localStorage.getItem('st_err')||'[]');
    a.unshift({t:Date.now(),m:msg.slice(0,220),u:(typeof U!=='undefined'&&U&&U.me&&U.me.role)||'-',h:tab||((typeof U!=='undefined'&&U&&U.tab)||'')});
    localStorage.setItem('st_err',JSON.stringify(a.slice(0,30)));
  }catch(e){}
}
window.addEventListener('error',e=>kmCatatError(e.message));
window.addEventListener('unhandledrejection',e=>kmCatatError((e.reason&&e.reason.message)||e.reason));
function kmHapusError(){try{localStorage.removeItem('st_err')}catch(e){}draw()}

function mfaMintaKode(){
  return new Promise(async res=>{
    let f=null;try{f=(await mfaFaktor())[0]}catch(e){}
    if(!f)return res(false);
    const old=$('mfa-ov');if(old)old.remove();
    const ov=document.createElement('div');ov.id='mfa-ov';ov.className='mdl-ov';document.body.appendChild(ov);
    ov.innerHTML=`<div class="mdl-box"><h4>Verifikasi dua langkah</h4><p>Masukkan 6 angka dari aplikasi autentikator di HP Anda.</p>
      <input id="mfa_kode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="width:100%;text-align:center;font-size:24px;letter-spacing:.3em">
      <div id="mfa_err" class="mu" style="color:var(--rd);min-height:20px;margin-top:6px"></div>
      <div class="mdl-acts"><button type="button" class="sec" id="mfa_batal">Batal</button><button type="button" id="mfa_ok">Verifikasi</button></div></div>`;
    $('mfa_batal').onclick=()=>{ov.remove();res(false)};
    $('mfa_ok').onclick=async()=>{
      const kode=($('mfa_kode').value||'').trim();
      if(kode.length!==6){$('mfa_err').textContent='Masukkan 6 angka.';return}
      $('mfa_err').textContent='Memeriksa…';
      const c=await SB.auth.mfa.challenge({factorId:f.id});
      if(c.error){$('mfa_err').textContent=c.error.message;return}
      const v=await SB.auth.mfa.verify({factorId:f.id,challengeId:c.data.id,code:kode});
      if(v.error){$('mfa_err').textContent='Kode salah atau kedaluwarsa.';return}
      ov.remove();res(true);
    };
    setTimeout(()=>{const i=$('mfa_kode');if(i)i.focus()},100);
  });
}

}

/* ===== Absen QR mandiri (kiosk): santri menunjukkan kartu QR, kehadiran tercatat otomatis sesuai jam ===== */
const AQ_DEF=[
  {k:'subuh',nama:'Subuh',tipe:'sholat',ref:0,tepat:15,akhir:45,jenis:'jamaah',on:1},
  {k:'dzuhur',nama:'Dzuhur',tipe:'sholat',ref:2,tepat:15,akhir:45,jenis:'jamaah',on:1},
  {k:'ashar',nama:'Ashar',tipe:'sholat',ref:3,tepat:15,akhir:45,jenis:'jamaah',on:1},
  {k:'maghrib',nama:'Maghrib',tipe:'sholat',ref:4,tepat:15,akhir:45,jenis:'jamaah',on:1},
  {k:'isya',nama:'Isya’',tipe:'sholat',ref:5,tepat:15,akhir:45,jenis:'jamaah',on:1},
  {k:'ngaji_quran',nama:'Ngaji Qur’an',tipe:'jam',mulai:'19:15',tepat:10,akhir:60,jenis:'ngaji',on:1},
  {k:'ngaji_kitab',nama:'Ngaji Kitab',tipe:'jam',mulai:'20:15',tepat:10,akhir:60,jenis:'ngaji',on:1},
  {k:'tidur',nama:'Waktu tidur',tipe:'jam',mulai:'22:00',tepat:15,akhir:60,jenis:'',on:1}
];
function aqNama(k){const x=AQ_DEF.find(y=>y.k===k);return x?x.nama:k}
function aqFmt(m){m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function aqMenit(s){const m=/^(\d{1,2})[:.](\d{2})$/.exec(String(s||'').trim());return m?(+m[1])*60+(+m[2]):null}
function aqTgl(n){return n.y+'-'+String(n.m).padStart(2,'0')+'-'+String(n.d).padStart(2,'0')}
function aqTabelHilang(e){return !!e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|Could not find the table/i.test(e.message||''))}
async function aqCfg(){const k=await kontenC();return Array.isArray(k.absen_sesi)&&k.absen_sesi.length?k.absen_sesi:AQ_DEF}
async function aqSesi(){
  const k=await kontenC(),cfg=await aqCfg(),t=waktuSholat(k.waktu||{});
  return cfg.filter(x=>x.on!==0&&x.on!==false).map(x=>({...x,mulai_m:x.tipe==='sholat'?Math.round(t[x.ref]):aqMenit(x.mulai)}))
    .filter(x=>x.mulai_m!=null&&!isNaN(x.mulai_m)).sort((a,b)=>a.mulai_m-b.mulai_m);
}
function aqAktif(sesi,now){
  const c=sesi.filter(x=>now>=x.mulai_m-5&&now<=x.mulai_m+(+x.akhir||45));
  return c.length?c.sort((a,b)=>b.mulai_m-a.mulai_m)[0]:null;
}
function aqNow(){const n=jkt(new Date());return{n,now:n.h*60+n.mi+n.s/60,tgl:aqTgl(n)}}
function aqCurDari(sesi,man){const{now}=aqNow();return man?(sesi.find(x=>x.k===man)||null):aqAktif(sesi,now)}

async function aqCatat(santriId,cur){
  const{n,now,tgl}=aqNow(),s=U.santri.find(x=>x.id==santriId);
  if(!s)return{ok:false,msg:'Kode tidak dikenal atau bukan santri aktif'};
  const st=now<=cur.mulai_m+(+cur.tepat||15)?'hadir':'telat';
  const r=await SB.from('kehadiran').insert({santri_id:santriId,kegiatan:cur.k,tanggal:tgl,status:st});
  if(r.error){
    if(r.error.code==='23505')return{ok:false,dup:true,nama:s.nama,msg:'Sudah absen'};
    if(aqTabelHilang(r.error))return{ok:false,fatal:true,msg:'Tabel kehadiran belum dipasang. Jalankan absen_qr.sql di Supabase.'};
    return{ok:false,msg:r.error.message};
  }
  if(st==='telat'&&cur.jenis&&localStorage.getItem('aq_oto')==='1'){
    try{
      await SB.from('pelanggaran').insert({santri_id:santriId,jenis:cur.jenis,ket:cur.nama+' (telat, absen QR)'});
      notifWaliSantri(santriId,{jenis:'Pelanggaran',judul:JN[cur.jenis]||cur.jenis,pesan:cur.nama+' (telat)',santri_nama:s.nama});
    }catch(e){}
  }
  return{ok:true,status:st,nama:s.nama,jam:String(n.h).padStart(2,'0')+':'+String(n.mi).padStart(2,'0')};
}

/* ---- pemindai kamera berkelanjutan ---- */
let AQS=null;
function aqBip(ok){
  try{
    const A=window.AudioContext||window.webkitAudioContext;
    if(A){AQS=AQS||{};AQS.ac=AQS.ac||new A();const c=AQS.ac,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:300;g.gain.value=.15;o.start();setTimeout(()=>{try{o.stop()}catch(e){}},ok?120:320)}
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate(ok?60:[80,60,80])}catch(e){}
}
function aqBanner(tipe,judul,sub){
  const el=$('aq_hasil');if(!el)return;
  const w={ok:'#047857',telat:'#b45309',dup:'#1d4ed8',err:'#b91c1c'}[tipe]||'#334155';
  el.style.background=w;el.innerHTML='<div style="font-size:22px;font-weight:800">'+esc(judul)+'</div><div style="opacity:.9">'+esc(sub||'')+'</div>';
}
async function aqProsesKode(kode){
  if(!AQS||AQS.busy)return;
  const id=+String(kode).replace(/\D/g,'');
  AQS.busy=true;
  try{
    const{now}=aqNow();
    const cur=AQS.man?(AQS.sesi.find(x=>x.k===AQS.man)||null):aqAktif(AQS.sesi,now);
    if(!cur){aqBanner('err','Tidak ada sesi aktif','Pindai dihentikan sementara');aqBip(false);return}
    const r=await aqCatat(id,cur);
    if(r.ok){
      aqBip(true);
      aqBanner(r.status==='hadir'?'ok':'telat','✔ '+r.nama,(r.status==='hadir'?'Hadir':'TELAT')+' · '+r.jam+' · '+cur.nama);
      AQS.n[r.status]=(AQS.n[r.status]||0)+1;
      const lg=$('aq_log');if(lg)lg.insertAdjacentHTML('afterbegin','<div>'+esc(r.jam)+' · '+esc(r.nama)+' · '+(r.status==='hadir'?'Hadir':'Telat')+'</div>');
    }else if(r.dup){aqBip(false);aqBanner('dup',r.nama,'Sudah absen untuk '+cur.nama)}
    else{aqBip(false);aqBanner('err','Gagal',r.msg||'');if(r.fatal)aqTutup()}
    const c=$('aq_cnt');if(c)c.textContent='Hadir '+(AQS.n.hadir||0)+' · Telat '+(AQS.n.telat||0)+' (sesi ini, pindai kali ini)';
  }finally{if(AQS)AQS.busy=false}
}
async function aqMulai(){
  const sesi=await aqSesi(),cur=aqCurDari(sesi,U.aqMan);
  if(!cur)return msgBox('Belum ada sesi aktif. Pilih sesi secara manual di bagian atas halaman jika ingin tetap memindai.');
  if(!window.jsQR){toast('Memuat pemindai QR…');await loadJsQR()}
  if(!window.jsQR)return msgBox('Pemindai QR belum termuat. Periksa koneksi internet, lalu coba lagi.');
  if(AQS&&AQS.on)return;
  const ov=document.createElement('div');ov.id='aq-ov';
  ov.style.cssText='position:fixed;inset:0;z-index:80;background:#0b1220;display:flex;flex-direction:column;color:#fff';
  ov.innerHTML=`<div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:17px">${esc(cur.nama)}</b><div style="font-size:12px;opacity:.75">${aqFmt(cur.mulai_m)} · tepat s.d. ${aqFmt(cur.mulai_m+(+cur.tepat||15))} · ditutup ${aqFmt(cur.mulai_m+(+cur.akhir||45))}</div></div><div style="display:flex;gap:8px"><button type="button" class="sec" onclick="aqPutarKamera()" title="Pindah kamera depan/belakang"><i class="fa-solid fa-camera-rotate"></i> Putar</button><button type="button" class="sec" onclick="aqTutup()">Selesai</button></div></div>
    <video id="aq_v" playsinline muted style="width:100%;height:40%;object-fit:cover;background:#000"></video>
    <div id="aq_hasil" style="margin:10px;padding:14px;border-radius:14px;background:#334155;text-align:center"><div style="font-size:18px;font-weight:700">Tunjukkan kartu QR ke kamera</div><div style="opacity:.8">Menunggu santri…</div></div>
    <div id="aq_cnt" class="mu" style="color:#cbd5e1;text-align:center">Hadir 0 · Telat 0 (sesi ini, pindai kali ini)</div>
    <div id="aq_log" style="flex:1;overflow:auto;padding:8px 16px;font-size:14px;color:#e2e8f0"></div>
    <div style="padding:10px"><button type="button" class="sec" style="width:100%" onclick="aqManual(true)">Ketik NIS / kode manual</button></div>`;
  document.body.appendChild(ov);
  AQS={on:true,busy:false,last:{},n:{hadir:0,telat:0},sesi,man:U.aqMan||null,ac:(AQS&&AQS.ac)||null};
  try{
    await aqKamera(localStorage.getItem('aq_kamera')==='user'?'user':'environment');
    const v=$('aq_v');
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(!AQS||!AQS.on)return;
      if(v.videoWidth&&!AQS.busy){
        const sc=Math.min(1,640/v.videoWidth);c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
        x.drawImage(v,0,0,c.width,c.height);
        const im=x.getImageData(0,0,c.width,c.height),r=jsQR(im.data,im.width,im.height);
        if(r&&/^PPPAS-\d+$/i.test(r.data.trim())){
          const kd=r.data.trim().toUpperCase(),t=Date.now();
          if(!AQS.last[kd]||t-AQS.last[kd]>4000){AQS.last[kd]=t;aqProsesKode(kd)}
        }
      }
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){aqTutup();msgBox('Kamera tidak bisa dibuka: '+e.message)}
}
async function aqKamera(mode){
  const v=$('aq_v');if(!v||!AQS)return;
  try{AQS.st&&AQS.st.getTracks().forEach(t=>t.stop())}catch(e){}
  let st;
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode}}})}
  catch(e){st=await navigator.mediaDevices.getUserMedia({video:true})}
  if(!AQS||!AQS.on){st.getTracks().forEach(t=>t.stop());return}
  AQS.st=st;AQS.mode=mode;v.srcObject=st;await v.play();
  v.style.transform=mode==='user'?'scaleX(-1)':'none';   // pratinjau kamera depan dicerminkan; pembacaan QR tidak terpengaruh
  try{localStorage.setItem('aq_kamera',mode)}catch(e){}
}
async function aqPutarKamera(){
  if(!AQS||!AQS.on)return;
  const m=AQS.mode==='user'?'environment':'user';
  try{await aqKamera(m);toast(m==='user'?'Kamera depan':'Kamera belakang')}
  catch(e){msgBox('Kamera tidak bisa dialihkan: '+(e.message||e))}
}
function aqTutup(){
  if(AQS){AQS.on=false;try{AQS.st&&AQS.st.getTracks().forEach(t=>t.stop())}catch(e){}try{AQS.ac&&AQS.ac.close()}catch(e){}}
  AQS=null;const o=$('aq-ov');if(o)o.remove();
  if(U&&U.me&&U.tab==='absenqr')draw();
}
function aqManual(dalamPindai){
  const old=$('aq-man');if(old)old.remove();
  const ov=document.createElement('div');ov.id='aq-man';ov.className='mdl-ov';ov.style.zIndex=95;document.body.appendChild(ov);
  ov.innerHTML=`<div class="mdl-box"><h4>Absen manual</h4><label>NIS atau kode (PPPAS-…)</label><input id="aq_mk" style="width:100%" autocomplete="off"><div class="mdl-acts"><button type="button" class="sec" id="aq_mb">Batal</button><button type="button" id="aq_mo">Catat</button></div></div>`;
  $('aq_mb').onclick=()=>ov.remove();
  $('aq_mo').onclick=async()=>{
    const c=($('aq_mk').value||'').trim().toUpperCase().replace(/\s/g,'');
    const bn=U.santri.find(s=>String(s.nis||'').replace(/\s/g,'')==c),id=bn?bn.id:+c.replace('PPPAS-','');
    ov.remove();
    if(!U.santri.some(s=>s.id==id))return msgBox('NIS atau kode tidak dikenal.');
    if(dalamPindai&&AQS){await aqProsesKode('PPPAS-'+id);return}
    const sesi=await aqSesi(),cur=aqCurDari(sesi,U.aqMan);
    if(!cur)return msgBox('Belum ada sesi aktif.');
    const r=await aqCatat(id,cur);
    if(r.ok){toast(r.nama+' · '+(r.status==='hadir'?'Hadir':'Telat'));draw()}else msgBox((r.nama?r.nama+': ':'')+r.msg);
  };
  setTimeout(()=>{const i=$('aq_mk');if(i)i.focus()},100);
}

async function aqCatatBelum(kegiatan,tgl){
  const sesi=await aqSesi(),cur=sesi.find(x=>x.k===kegiatan);
  if(!cur||!cur.jenis)return msgBox('Sesi ini tidak terhubung ke jenis pelanggaran.');
  const r=await SB.from('kehadiran').select('santri_id').eq('tanggal',tgl).eq('kegiatan',kegiatan);
  const ada=new Set((r.data||[]).map(x=>String(x.santri_id)));
  const belum=U.santri.filter(s=>!ada.has(String(s.id)));
  if(!belum.length)return msgBox('Semua santri sudah absen.');
  uiConfirm('Catat '+belum.length+' santri yang belum absen sebagai pelanggaran "'+(JN[cur.jenis]||cur.jenis)+'" untuk '+cur.nama+'? Ini juga mengirim pemberitahuan ke wali.',async()=>{

    const e=await SB.from('pelanggaran').insert(rows);
    if(e.error)return msgBox(e.error.message);
    belum.forEach(s=>notifWaliSantri(s.id,{jenis:'Pelanggaran',judul:JN[cur.jenis]||cur.jenis,pesan:cur.nama+' (tidak hadir)',santri_nama:s.nama}));
    try{localStorage.setItem('aq_final_'+tgl+'_'+kegiatan,'1')}catch(e2){}
    toast(rows.length+' catatan pelanggaran tersimpan.');draw();
  });
}

async function aqSimpanCfg(){
  const cfg=(await aqCfg()).map((x,i)=>{
    const y={...x};
    y.on=$('aqo'+i)?.checked?1:0;
    y.nama=($('aqn'+i)?.value||x.nama).trim()||x.nama;
    if(x.tipe==='jam'){const j=($('aqj'+i)?.value||'').trim();if(aqMenit(j)==null)throw new Error('Jam "'+j+'" pada sesi '+y.nama+' tidak valid (contoh 19:15).');y.mulai=j.replace('.',':')}
    y.tepat=Math.max(0,+($('aqt'+i)?.value)||0);y.akhir=Math.max(1,+($('aqa'+i)?.value)||45);
    y.jenis=$('aqk'+i)?.value||'';
    return y;
  });
  await simpanKonten('absen_sesi',cfg);draw();
}

function aqHapusSesi(k){

    const cfg=(await aqCfg()).filter(x=>x.k!==k);await simpanKonten('absen_sesi',cfg);draw();
  });
}
async function aqResetCfg(){uiConfirm('Kembalikan semua sesi ke pengaturan awal?',async()=>{await simpanKonten('absen_sesi',AQ_DEF);draw()})}

R.absenqr=async()=>{
  const sesi=await aqSesi(),{now,tgl}=aqNow(),man=U.aqMan&&sesi.some(x=>x.k===U.aqMan)?U.aqMan:null;
  if(U.aqMan&&!man)U.aqMan=null;
  const cur=aqCurDari(sesi,man),next=cur?null:sesi.find(x=>x.mulai_m-5>now);
  const isAdm=U.me.role==='admin';
  let h=`<div class="card"><h3><i class="fa-solid fa-user-check" style="color:#047857"></i> Absen QR mandiri</h3>
    <div class="mu">Santri menunjukkan kartu QR-nya ke kamera. Kehadiran tercatat otomatis sesuai jam sesi. Letakkan perangkat ini di pintu masjid atau kamar dan awasi saat santri memindai.</div>
    <label>Sesi</label><select style="width:100%" onchange="U.aqMan=this.value||null;draw()"><option value="">Otomatis (ikuti jam)</option>${sesi.map(x=>`<option value="${esc(x.k)}"${man===x.k?' selected':''}>${esc(x.nama)} · ${aqFmt(x.mulai_m)}</option>`).join('')}</select>`
    +(cur?`<div style="margin-top:10px;padding:12px;border-radius:12px;background:#ecfdf5;border:1px solid #a7f3d0"><b style="font-size:18px">${esc(cur.nama)}</b>${man?' <span class="badge b1">manual</span>':' <span class="badge b0">sedang berlangsung</span>'}<div class="mu">Mulai ${aqFmt(cur.mulai_m)} · hadir tepat s.d. ${aqFmt(cur.mulai_m+(+cur.tepat||15))} · ditutup ${aqFmt(cur.mulai_m+(+cur.akhir||45))}</div></div>
       <div class="row" style="margin-top:10px"><button type="button" onclick="aqMulai()"><i class="fa-solid fa-camera"></i> Mulai pemindai</button><button type="button" class="sec" onclick="aqManual(false)">Ketik NIS</button></div>`
      :`<div style="margin-top:10px;padding:12px;border-radius:12px;background:#f1f5f9"><b>Belum ada sesi aktif</b><div class="mu">${next?'Berikutnya: '+esc(next.nama)+' pukul '+aqFmt(next.mulai_m)+' (dibuka 5 menit sebelumnya).':'Tidak ada sesi lagi hari ini.'} Pilih sesi manual di atas bila perlu.</div></div>`)
    +`<label class="ck" style="margin-top:10px"><input type="checkbox" ${localStorage.getItem('aq_oto')==='1'?'checked':''} onchange="aqOto(this)"> Catat santri yang <b>telat</b> otomatis sebagai pelanggaran</label></div>`;
  if(cur){
    const r=await SB.from('kehadiran').select('*').eq('tanggal',tgl).eq('kegiatan',cur.k).order('waktu',{ascending:false});
    if(r.error){
      h+=`<div class="card"><h3>Tabel belum siap</h3><div class="mu">${aqTabelHilang(r.error)?'Jalankan <b>absen_qr.sql</b> sekali di Supabase (SQL Editor) untuk mengaktifkan fitur ini.':esc(r.error.message)}</div></div>`;
    }else{
      const rows=r.data||[],ada=new Set(rows.map(x=>String(x.santri_id))),belum=U.santri.filter(s=>!ada.has(String(s.id)));
      const nm=id=>(U.santri.find(s=>s.id==id)||{}).nama||('#'+id);
      const hadir=rows.filter(x=>x.status==='hadir').length,telat=rows.length-hadir;
      const jam=v=>new Date(v).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit'});
      const final=localStorage.getItem('aq_final_'+tgl+'_'+cur.k)==='1';
      h+=`<div class="card"><h3>Rekap ${esc(cur.nama)} hari ini</h3>
        <div class="li"><span>Hadir tepat waktu</span><b style="color:var(--ok)">${hadir}</b></div>
        <div class="li"><span>Telat</span><b style="color:#b45309">${telat}</b></div>
        <div class="li"><span>Belum absen</span><b style="color:var(--rd)">${belum.length}</b></div>
        <div class="li"><span>Total santri aktif</span><b>${U.santri.length}</b></div>
        ${(cur.jenis&&belum.length)?`<p><button type="button" class="${final?'sec':''}" onclick="aqCatatBelum('${esc(cur.k)}','${tgl}')">${final?'Sudah dicatat. Catat lagi?':'Catat yang belum hadir sebagai pelanggaran'}</button></p><div class="mu">Gunakan setelah sesi ditutup. Wali akan menerima pemberitahuan.</div>`:''}</div>`;
      h+=`<div class="card"><h3>Sudah absen (${rows.length})</h3>`+(rows.length?rows.map(x=>`<div class="li"><span><b>${esc(nm(x.santri_id))}</b><div class="mu">${jam(x.waktu)}</div></span><span><span class="badge ${x.status==='hadir'?'b0':'b1'}">${x.status==='hadir'?'Hadir':'Telat'}</span>${isAdm?` <button type="button" class="sec" style="padding:4px 9px;font-size:12px" onclick="aqHapus(${x.id})">✕</button>`:''}</span></div>`).join(''):'<div class="mu">Belum ada.</div>')+`</div>`;
      h+=`<div class="card"><h3>Belum absen (<span id="aq_cb" data-t="${belum.length}">${belum.length}</span>)</h3>`
        +(belum.length?`<input id="aq_cari" type="search" placeholder="Cari nama atau kamar…" autocomplete="off" style="width:100%" oninput="aqCari(this.value)">
        <div id="aq_belum" style="max-height:55vh;overflow-y:auto;margin-top:8px;border:1px solid #e2e8f0;border-radius:12px">`
        +belum.map(s=>`<div class="li aq-row" data-n="${esc((s.nama+' '+(s.kamar||'')).toLowerCase())}" style="padding:8px 12px"><span>${esc(s.nama)} <span class="mu">${esc(s.kamar||'')}</span></span><button type="button" class="sec" style="padding:5px 10px;font-size:12px" onclick="aqHadirManual(${s.id})">Hadir</button></div>`).join('')
        +`<div id="aq_kosong" class="mu" style="display:none;padding:12px">Tidak ada nama yang cocok.</div></div>`:'<div class="mu">Semua santri sudah absen.</div>')+`</div>`;
    }
  }
  if(isAdm){
    const cfg=await aqCfg();
    h+=`<div class="card"><h3>Pengaturan sesi</h3><div class="mu">Sesi sholat mengikuti jam adzan di Kelola konten. Sesi lain memakai jam yang Anda isi. "Tepat" = menit setelah mulai yang masih dihitung hadir; "Tutup" = batas akhir pemindaian.</div>`
    +cfg.map((x,i)=>`<div style="border-top:1px solid #e2e8f0;margin-top:10px;padding-top:8px">
      <label class="ck"><input type="checkbox" id="aqo${i}" ${x.on===0||x.on===false?'':'checked'}> <b>Aktif</b></label>
      <label>Nama sesi</label><input id="aqn${i}" style="width:100%" value="${esc(x.nama)}">
      ${x.tipe==='jam'?`<label>Jam mulai (HH:MM)</label><input id="aqj${i}" style="width:100%" value="${esc(x.mulai||'')}" placeholder="19:15">`:'<div class="mu" style="margin-top:6px">Mulai: mengikuti waktu adzan</div>'}
      <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label>Tepat (menit)</label><input id="aqt${i}" type="number" style="width:100%" value="${+x.tepat||0}"></div><div style="flex:1"><label>Tutup (menit)</label><input id="aqa${i}" type="number" style="width:100%" value="${+x.akhir||45}"></div></div>
      <label>Jika tidak hadir/telat dicatat sebagai</label><select id="aqk${i}" style="width:100%"><option value="">Tidak dicatat sebagai pelanggaran</option>${Object.entries(JN).map(([k,v])=>`<option value="${k}"${x.jenis===k?' selected':''}>${v}</option>`).join('')}</select>
      ${x.tipe==='jam'?`<p><button type="button" class="sec" style="padding:5px 10px;font-size:12px" onclick="aqHapusSesi('${esc(x.k)}')">Hapus sesi</button></p>`:''}</div>`).join('')
    +`<div class="row" style="margin-top:12px"><button type="button" onclick="aqSimpanCfgAman()">Simpan</button><button type="button" class="sec" onclick="aqTambahSesi()">+ Tambah sesi</button><button type="button" class="sec" onclick="aqResetCfg()">Kembalikan awal</button></div></div>`;
  }
  return h;
};

/* ---- Profil / biodata pondok (klik logo di header; admin dapat mengedit) ---- */
const PP_FIELDS=[['nama','Nama pondok pesantren'],['yayasan','Yayasan'],['pembina','Pembina'],['pengasuh','Pengasuh'],['ketua','Kepala / Ketua pondok'],['berdiri','Tahun berdiri'],['izin','Nomor izin / NSPP'],['alamat','Alamat lengkap','ta'],['gps','Lokasi GPS (lintang, bujur)'],['telp','Telepon / WhatsApp'],['email','Email'],['web','Website'],['tentang','Tentang pondok','ta']];
const PP_DEF={nama:'PPP. Al-As’adiyah Blega'};
async function ppLoad(force){
  if(U._pp&&!force)return U._pp;
  let v=null;
  try{const{data}=await SB.from('konten').select('nilai').eq('kunci','profil_pondok').maybeSingle();if(data&&data.nilai&&typeof data.nilai==='object')v=data.nilai}catch(e){}
  U._pp={...PP_DEF,...(v||{})};return U._pp;
}
async function bukaProfilPondok(mode){
  const old=$('pp-ov');if(old)old.remove();
  const ov=document.createElement('div');ov.id='pp-ov';ov.className='mdl-ov';document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
  ov.innerHTML='<div class="mdl-box" style="text-align:center;padding:28px"><i class="fa-solid fa-spinner fa-spin"></i></div>';
  const d=await ppLoad(mode==='reload');
  const isAdm=U.me&&U.me.role==='admin';
  const box='class="mdl-box" style="width:100%;max-width:440px;max-height:88vh;overflow:auto;text-align:left"';
  if(mode==='edit'&&isAdm){
    ov.innerHTML=`<div ${box}><h4>Edit biodata pondok</h4>${PP_FIELDS.map(f=>`<label>${f[1]}</label>${f[2]==='ta'?`<textarea id="pp_${f[0]}" rows="3" style="width:100%">${esc(d[f[0]]||'')}</textarea>`:`<input id="pp_${f[0]}" style="width:100%" value="${esc(d[f[0]]||'')}">`}`).join('')}
      <div class="mu" style="margin-top:4px">Contoh GPS: -7.0456, 112.7123 (salin dari Google Maps → tekan lama pada lokasi).</div>
      <div class="row" style="margin-top:8px"><button type="button" class="sec" onclick="ppGpsSaya()"><i class="fa-solid fa-location-crosshairs"></i> Pakai lokasi saya</button></div>
      <div class="mdl-acts"><button type="button" class="sec" onclick="bukaProfilPondok()">Batal</button><button type="button" onclick="ppSimpan()">Simpan</button></div></div>`;
    return;
  }
  const gps=String(d.gps||'').trim();
  const hpd=String(d.telp||'').replace(/\D/g,'');const wa=hpd?(hpd.startsWith('0')?'62'+hpd.slice(1):hpd):'';
  const web=d.web?(/^https?:\/\//i.test(d.web)?d.web:'https://'+d.web):'';
  const row=(l,v)=>v?`<div class="li"><span>${l}</span><b style="text-align:right;max-width:62%">${v}</b></div>`:'';
  const act=(h,ic,t)=>`<a href="${esc(h)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:#047857;color:#fff;text-decoration:none;font-size:13px;font-weight:600"><i class="${ic}"></i> ${t}</a>`;
  const acts=[gps?act('https://www.google.com/maps?q='+encodeURIComponent(gps),'fa-solid fa-location-dot','Buka peta'):'',wa?act('https://wa.me/'+wa,'fa-brands fa-whatsapp','WhatsApp'):'',d.telp?act('tel:'+d.telp.replace(/[^\d+]/g,''),'fa-solid fa-phone','Telepon'):''].filter(Boolean).join(' ');
  ov.innerHTML=`<div ${box}>
    <div style="text-align:center"><div class="hlogo" style="width:84px;height:84px;margin:0 auto 8px;cursor:default"><img src="${LOGO_URL()}" alt="" onerror="this.onerror=null;this.src=LOGO_DEF" style="width:100%;height:100%;object-fit:contain;border-radius:50%"></div>
    <div style="font-size:18px;font-weight:800">${esc(d.nama||'')}</div>${d.yayasan?`<div class="mu">${esc(d.yayasan)}</div>`:''}</div>
    <div style="margin-top:10px">${row('Pembina',esc(d.pembina||''))}${row('Pengasuh',esc(d.pengasuh||''))}${row('Kepala / Ketua',esc(d.ketua||''))}${row('Tahun berdiri',esc(d.berdiri||''))}${row('Nomor izin / NSPP',esc(d.izin||''))}${row('Alamat',esc(d.alamat||''))}${row('Lokasi GPS',esc(gps))}${row('Telepon / WA',esc(d.telp||''))}${row('Email',d.email?`<a href="mailto:${esc(d.email)}">${esc(d.email)}</a>`:'')}${row('Website',web?`<a href="${esc(web)}" target="_blank" rel="noopener">${esc(d.web)}</a>`:'')}</div>
    ${d.tentang?`<div style="margin-top:10px"><b>Tentang</b><div class="mu" style="white-space:pre-line;margin-top:4px">${esc(d.tentang)}</div></div>`:''}
    ${(!d.pembina&&!d.alamat&&!gps&&!d.telp)?`<div class="mu" style="margin-top:10px">${isAdm?'Biodata pondok belum diisi. Tekan Edit untuk mengisi.':'Biodata pondok belum diisi oleh admin.'}</div>`:''}
    ${acts?`<div class="row" style="margin-top:12px;justify-content:center">${acts}</div>`:''}
    <div class="mdl-acts" style="flex-wrap:wrap"><button type="button" class="sec" onclick="document.getElementById('pp-ov').remove();bukaStoryDariLogo()"><i class="fa-solid fa-circle-play"></i> Story</button>${isAdm?`<button type="button" class="sec" onclick="bukaProfilPondok('edit')"><i class="fa-solid fa-pen"></i> Edit</button>`:''}<button type="button" onclick="document.getElementById('pp-ov').remove()">Tutup</button></div></div>`;
}
function ppGpsSaya(){
  if(!navigator.geolocation)return msgBox('Perangkat tidak mendukung GPS.');
  toast('Mengambil lokasi…');
  navigator.geolocation.getCurrentPosition(p=>{const el=$('pp_gps');if(el)el.value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)},e=>msgBox('Lokasi tidak bisa diambil: '+(e.message||'izin ditolak')),{enableHighAccuracy:true,timeout:15000});
}
async function ppSimpan(){
  if(!U.me||U.me.role!=='admin')return msgBox('Hanya admin yang bisa mengubah.');
  const v={};PP_FIELDS.forEach(f=>{v[f[0]]=($('pp_'+f[0])?.value||'').trim()});
  if(!v.nama)return msgBox('Nama pondok wajib diisi.');
  if(v.gps&&!/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(v.gps))return msgBox('Format GPS: lintang, bujur. Contoh: -7.0456, 112.7123');
  const{error}=await SB.from('konten').upsert({kunci:'profil_pondok',nilai:v,diubah:new Date().toISOString()});
  if(error)return msgBox(error.message);
  U._pp={...PP_DEF,...v};toast('Biodata pondok tersimpan.');bukaProfilPondok();
}

function fotoBoxHtml(url,w,h){
  return `<div style="width:${w||96}px;height:${h||120}px;border-radius:12px;background:#e2e8f0;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:34px">${url?`<img src="${esc(url)}" alt="Foto" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML='<i class=&quot;fa-solid fa-user&quot;></i>'">`:'<i class="fa-solid fa-user"></i>'}</div>`;
}
function bioRowsHtml(o){
  o=o||{};
  const v=(...k)=>{for(const x of k){if(o[x]!==undefined&&o[x]!==null&&String(o[x]).trim()!=='')return String(o[x])}return ''};
  const tgl=v('tgl_lahir');
  let ttl=[v('tempat_lahir'),tgl&&/^\d{4}-\d{2}-\d{2}/.test(tgl)?fd(tgl.slice(0,10)):tgl].filter(Boolean).join(', ');
  const rows=[['NIS',v('nis')],['Kamar',v('kamar')],['Kelas',v('kelas','tingkat')],['Angkatan',v('angkatan')],['Tahun lulus',v('tahun_lulus')],['Tempat, tgl lahir',ttl],['Anak ke',v('anak_ke')],['Asal sekolah',v('asal_sekolah')],['Alamat',v('alamat')],['Nama ayah',v('ayah','nama_ayah')],['Nama ibu',v('ibu','nama_ibu')],['Wali',v('wali','nama_wali')],['No. HP wali',v('hp','no_hp','hp_wali')]];
  return rows.filter(r=>r[1]).map(r=>`<div class="li"><span>${r[0]}</span><b style="text-align:right">${esc(r[1])}</b></div>`).join('');
}

/* ---- Top 3 santri paling sering melanggar (admin) ---- */
async function hitungTopPelanggarLokal(m){
  const awal=new Date();awal.setMonth(awal.getMonth()-m);
  const rows=ok(await SB.from('pelanggaran').select('santri_id,jenis,waktu').gte('waktu',awal.toISOString()).limit(10000))||[];
  const smap=new Map(U.santri.map(s=>[s.id,s]));
  const aktifRows=rows.filter(r=>smap.has(r.santri_id));
  const kats=['semua','jamaah','ngaji','hp','kembali','lain'];
  const out=[];
  for(const k of kats){
    const sub=k==='semua'?aktifRows:aktifRows.filter(r=>r.jenis===k);
    const totalKat=sub.length;
    if(!totalKat)continue;
    const cnt=new Map();
    for(const r of sub)cnt.set(r.santri_id,(cnt.get(r.santri_id)||0)+1);
    const santriMelanggar=cnt.size;
    const sorted=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
    sorted.forEach(([sid,jml],idx)=>{
      const s=smap.get(sid)||{};
      out.push({
        kategori:k,
        urutan:idx+1,
        santri_id:sid,
        nama_santri:s.nama||'-',
        kamar_santri:s.kamar||'',
        total_langgar:jml,
        total_kategori:totalKat,
        santri_melanggar:santriMelanggar,
        persen:Math.round((jml*1000)/totalKat)/10
      });
    });
  }
  return out;
}

function menuHtml(){
  const role=U.me.role;
  const isAl=role==='alumni';
  const allow=isAl?new Set((MN.alumni||[]).flatMap(x=>x[1])):new Set((role=='wali'?TW:role=='admin'?TA:TS).map(t=>t[0]));
  const q=(U.mq||'').trim().toLowerCase();
  const secs=MN[role]||MN.alumni||[];
  let html='';
  secs.forEach(([sec,ks])=>{
    let it=ks.filter(k=>allow.has(k));
    if(q) it=it.filter(k=>(TL[k]||k).toLowerCase().includes(q)||k.toLowerCase().includes(q)||sec.toLowerCase().includes(q));
    if(!it.length)return;
    html+=`<div class="mcard"><div class="mhd">${sec}</div><div class="mgrid">${it.map(k=>`<button class="mt" onclick="goTab('${k}')"><span class="mi">${k=='tabungan'?CHEST_SVG(26):`<i class="${IC[k]||'fa-solid fa-circle'}"></i>`}${k=='notif'&&U.unread?`<b class="mb">${U.unread}</b>`:''}${k=='konfirmasi'&&U.pend?`<b class="mb">${U.pend}</b>`:''}</span><span class="ml">${TL[k]||k}</span></button>`).join('')}</div></div>`;
  });
  if(q&&!html) html=`<div class="card"><div class="mu">Tidak ada menu yang cocok dengan “${esc(U.mq)}”.</div></div>`;
  return html;
}
function allMenuItems(){
  const role=U.me.role,isAl=role==='alumni';
  const allow=isAl?new Set((MN.alumni||[]).flatMap(x=>x[1])):new Set((role=='wali'?TW:role=='admin'?TA:TS).map(t=>t[0]));
  const secs=MN[role]||MN.alumni||[];
  const out=[];
  secs.forEach(([sec,ks])=>ks.filter(k=>allow.has(k)).forEach(k=>out.push({k,sec,label:TL[k]||k})));
  return out;
}

async function getFotos(list){
  const ps=[...new Set((list||[]).filter(s=>s&&s.foto_path).map(s=>String(s.foto_path)))];
  const m={};
  if(!ps.length)return m;
  const put=(key,url)=>{
    if(!key||!url)return;
    m[key]=url;
    const s=String(key);
    const base=s.split('/').pop();
    if(base)m[base]=url;
    // variasi path yang sering beda di signed URL
    if(s.startsWith('foto/'))m[s.slice(5)]=url;
    else m['foto/'+s]=url;
  };
  // 1) Batch signed URL
  try{
    const r=await SB.storage.from('foto').createSignedUrls(ps,7200);
    (r.data||[]).forEach((x,i)=>{
      if(!x||x.error||!x.signedUrl)return;
      put(ps[i],x.signedUrl);
      put(x.path,x.signedUrl);
    });
  }catch(e){}
  // 2) Satu per satu signed URL untuk yang belum dapat
  for(const p of ps){
    if(m[p])continue;
    try{
      const r=await SB.storage.from('foto').createSignedUrl(p,7200);
      if(r&&!r.error&&r.data&&r.data.signedUrl)put(p,r.data.signedUrl);
    }catch(e){}
  }
  // 3) Download → blob URL (berjalan jika policy storage mengizinkan download)
  for(const p of ps){
    if(m[p])continue;
    try{
      const r=await SB.storage.from('foto').download(p);
      if(r&&!r.error&&r.data){
        const url=URL.createObjectURL(r.data);
        put(p,url);
      }
    }catch(e){}
  }
  // 4) Coba public URL (jika bucket/objek kebetulan publik)
  for(const p of ps){
    if(m[p])continue;
    try{
      const pub=SB.storage.from('foto').getPublicUrl(p);
      const u=pub&&pub.data&&pub.data.publicUrl;
      if(u&&await okImg(u))put(p,u);
    }catch(e){}
  }
  // Samakan key ke foto_path asli
  ps.forEach(p=>{
    if(m[p])return;
    const base=String(p).split('/').pop();
    if(base&&m[base])m[p]=m[base];
    else if(m['foto/'+p])m[p]=m['foto/'+p];
    else if(p.startsWith('foto/')&&m[p.slice(5)])m[p]=m[p.slice(5)];
  });
  return m;
}
function fotoDariMap(fo,path){
  if(!path)return '';
  if(!fo)return '';
  if(fo[path])return fo[path];
  const s=String(path);
  const base=s.split('/').pop();
  if(base&&fo[base])return fo[base];
  if(fo['foto/'+s])return fo['foto/'+s];
  if(s.startsWith('foto/')&&fo[s.slice(5)])return fo[s.slice(5)];
  return '';
}

/* ---- Admin: Sisa coin santri ---- */
R.sisacoin=async()=>{
  const saldoMap=new Map();
  const list=U.santri||[];
  // Sumber utama: RPC 'saldo' per santri (sama dengan yang dipakai akun wali)
  const _ambilSaldo=async s=>{
    try{
      const r=await SB.rpc('saldo',{p_santri:s.id});
      if(r.error||r.data==null)throw (r.error||new Error('kosong'));
      saldoMap.set(String(s.id),Number(r.data)||0);
    }catch(e){}
  };
  for(let i=0;i<list.length;i+=8)await Promise.all(list.slice(i,i+8).map(_ambilSaldo));
  // Cadangan untuk santri yang belum terisi: jumlahkan transaksi
  const miss=list.filter(s=>!saldoMap.has(String(s.id)));
  if(miss.length){
    try{
      const tx=ok(await SB.from('transaksi').select('santri_id,tipe,jumlah').limit(10000))||[];
      const m=new Map();
      tx.forEach(x=>{const k=String(x.santri_id);m.set(k,(m.get(k)||0)+(x.tipe==='topup'?Number(x.jumlah||0):-Number(x.jumlah||0)))});
      miss.forEach(s=>saldoMap.set(String(s.id),m.get(String(s.id))||0));
    }catch(e){}
  }
  let rows=(U.santri||[]).map(s=>({santri_id:s.id,nama:s.nama,kamar:s.kamar,saldo:saldoMap.get(String(s.id))||0}));
  const total=rows.reduce((a,x)=>a+Number(x.saldo||0),0);
  return `<div class="card"><h3>Total sisa coin santri aktif</h3><div style="font-size:24px;font-weight:800;color:#047857">${coin(total)}</div><div class="mu">${rows.length} santri aktif · hanya terlihat oleh admin.</div></div>
  <div class="card"><h3>Rincian per santri (${rows.length})</h3>`+(rows.length?rows.map(x=>`<div class="li"><span><b>${esc(x.nama)}</b> <span class="mu">${esc(x.kamar||'')}</span></span><span style="display:flex;align-items:center;gap:8px"><b>${coin(x.saldo)}</b><button type="button" class="sec" onclick="editCoinSantri(${x.santri_id},'${esc(x.nama)}',${Number(x.saldo||0)})" title="Edit coin"><i class="fa-solid fa-pen"></i></button></span></div>`).join(''):'<div class="mu">Tidak ada data santri yang cocok.</div>')+'</div>';
};
async function editCoinSantri(id,nama,cur){
  uiPrompt('Edit Sisa Coin','Masukkan jumlah sisa coin baru untuk '+nama+' (sekarang: '+cur+'):',String(cur),async(v)=>{
    if(v===null)return;
    const target=Math.floor(Number(v));
    if(isNaN(target)||target<0)return msgBox('Masukkan angka 0 atau lebih.');
    const{error}=await SB.rpc('admin_set_coin',{p_santri:id,p_target:target});
    if(error)return msgBox(error.message);
    toast('Sisa coin '+nama+' diperbarui menjadi '+coin(target)+'.');
    draw();
  },'number');
}

R.saku=async()=>{
  const s=U.sid;
  if(!s)return '<div class="card">Belum ada santri terhubung. Hubungi pengurus.</div>';
  const k=await kontenC(),rek=k.rekening||[];
  let sd=0,tx=[],rq=[];
  try{
    const r=await SB.from('transaksi').select('*').eq('santri_id',s).order('waktu',{ascending:false}).limit(40);
    if(r.error)throw r.error;
    tx=Array.isArray(r.data)?r.data:[];
  }catch(e){tx=[]}
  try{
    const r=await SB.rpc('saldo',{p_santri:s});
    if(!r.error&&r.data!=null)sd=Number(r.data)||0;
    else throw (r.error||new Error('rpc'));
  }catch(e){
    sd=tx.reduce((a,x)=>{const n=Number(x.jumlah)||0;return a+(x.tipe==='topup'?n:-n)},0);
  }
  try{
    const r=await SB.from('topup_request').select('*').eq('santri_id',s).order('id',{ascending:false}).limit(15);
    if(!r.error)rq=Array.isArray(r.data)?r.data:[];
  }catch(e){rq=[]}
  const st={menunggu:['b1','Menunggu konfirmasi admin'],disetujui:['b0','Disetujui'],ditolak:['b2','Ditolak']};
  const rekHtml=rek.length
    ?('<div class="psbbox"><h4>Rekening tujuan transfer</h4>'+rek.map(r=>'<div class="li"><span><b>'+esc(r.bank)+'</b> · '+esc(r.nomor)+'<div class="mu">a.n. '+esc(r.nama)+'</div></span><button type="button" class="sec" onclick="salin(\''+esc(r.nomor)+'\')">Salin</button></div>').join('')+'</div>')
    :'<div class="mu" style="margin-bottom:8px">Nomor rekening pondok belum diisi admin.</div>';
  const rqHtml=rq.length
    ?('<div class="card"><h3>Permintaan isi ulang</h3>'+rq.map(x=>{
        const a=st[x.status]||['',''];
        return '<div class="li"><span><b>'+rp(x.nominal)+'</b><div class="mu">'+esc(x.ket||'')+(x.ket?' · ':'')+fdt(x.dibuat)+'</div>'+(x.catatan_admin?'<div class="mu" style="color:var(--rd)">Catatan admin: '+esc(x.catatan_admin)+'</div>':'')+'</span><span class="badge '+a[0]+'">'+a[1]+'</span></div>';
      }).join('')+'</div>')
    :'';
  const txHtml=tx.length
    ?tx.map(x=>'<div class="li"><span>'+esc(x.ket)+'<div class="mu">'+fdt(x.waktu)+'</div></span><b style="color:'+(x.tipe=='topup'?'var(--ok)':'var(--rd)')+'">'+(x.tipe=='topup'?'+':'-')+coin(x.jumlah)+'</b></div>').join('')
    :'<div class="mu">Belum ada transaksi.</div>';
  return '<div class="card" style="background:linear-gradient(135deg,#064e3b,#047857);color:#fff"><div style="font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.06em">Sisa coin uang saku</div><div style="font-size:28px;font-weight:800;margin-top:4px">'+coin(sd)+'</div><div style="font-size:12px;opacity:.85;margin-top:4px">1 coin = Rp1 · dipakai untuk jajan/belanja di kasir pondok dan membayar tagihan.</div></div>'
    +'<div class="card"><h3>Isi ulang coin (transfer)</h3>'+rekHtml
    +'<label>Nominal transfer (Rp)</label><input id="tp_n" type="number" min="1000" placeholder="Contoh: 100000" style="width:100%"><label>Catatan (opsional)</label><input id="tp_k" placeholder="Contoh: transfer dari BCA a.n. Budi" style="width:100%"><label>Foto bukti transfer</label><input id="tp_f" type="file" accept="image/*" style="width:100%"><p><button id="tp_b" onclick="kirimTopup()">Kirim bukti transfer</button></p></div>'
    +rqHtml
    +'<div class="card"><h3>Riwayat coin</h3>'+txHtml+'</div>';
};

  {id:'admin',label:'Administrasi (Administrator)'},

function strukturHtml(list){
  const card=(x,big)=>{const u=fotoStr(x.foto);return `<div class="stc ${big?'stb':''}"><div class="stf" style="${u?`background-image:url('${esc(u)}')`:''}">${u?'':'<i class="fa-solid fa-user"></i>'}</div><div class="stn">${esc(x.nama)}</div><div class="stj">${esc(x.jabatan||'')}</div></div>`};
  if(!list||!list.length)return `<div class="card">${emp}</div>`;
  // Group by bagian; items without bagian or marked utama go to top / pendiri
  const groups={};
  ST_BAGIAN.forEach(b=>groups[b.id]=[]);
  const other=[];
  list.forEach(x=>{
    const bag=x.bagian||(x.utama?'pendiri':'');
    if(bag&&groups[bag])groups[bag].push(x);
    else other.push(x);
  });
  let h='';
  ST_BAGIAN.forEach(b=>{
    const items=groups[b.id]||[];
    if(!items.length)return;
    const isTop=b.id==='pendiri'||b.id==='pengawas';
    h+=`<div class="card" style="${isTop?'background:linear-gradient(180deg,#ecfdf5,#fff)':''}">
      <h3 style="margin:0 0 12px;font-size:14px;color:#065f46;border-bottom:1px solid #d1fae5;padding-bottom:8px"><i class="fa-solid fa-sitemap" style="margin-right:6px"></i>${esc(b.label)}</h3>
      <div class="stg">${items.map(x=>card(x,isTop)).join('')}</div>
    </div>`;
  });
  if(other.length){
    h+=`<div class="card"><h3 style="margin:0 0 12px;font-size:14px;color:#065f46">Lainnya</h3><div class="stg">${other.map(x=>card(x,0)).join('')}</div></div>`;
  }
  return h||`<div class="card">${emp}</div>`;
}

/* ---- Tabungan santri ---- */
R.tabungan=async()=>{
  const st=U.me.role!='wali';
  if(st&&(!U.ts||!U.santri.some(s=>s.id==U.ts)))U.ts=U.santri[0]?.id||0;
  const s=st?U.ts:U.sid;
  if(!s)return '<div class="card">Belum ada data santri.</div>';
  let sd=0,tx=[],errTb='';
  const tglTb=x=>x.waktu||x.dibuat||x.created_at||x.tanggal||'';
  // 1) RPC riwayat (jika sudah dipasang), 2) tabel langsung dengan beberapa urutan cadangan
  let got=false;
  try{
    const r=await SB.rpc('tabungan_riwayat',{p_santri:s});
    if(!r.error&&Array.isArray(r.data)){tx=r.data;got=true}
  }catch(e){}
  if(!got){
    for(const ord of ['waktu','id',null]){
      try{
        let q=SB.from('tabungan').select('*').eq('santri_id',s);
        if(ord)q=q.order(ord,{ascending:false});
        const r=await q.limit(200);
        if(r.error)throw r.error;
        tx=Array.isArray(r.data)?r.data:[];errTb='';got=true;break;
      }catch(e){errTb=(e&&e.message)||String(e)}
    }
  }
  tx=tx.slice().sort((x,y)=>String(tglTb(y)).localeCompare(String(tglTb(x))));
  try{
    const r=await SB.rpc('saldo_tabungan',{p_santri:s});
    if(!r.error&&r.data!=null)sd=Number(r.data)||0;
    else throw (r.error||new Error('rpc'));
  }catch(e){
    // Fallback: hitung dari riwayat
    sd=tx.reduce((a,x)=>{
      const n=Number(x.jumlah)||0;
      return a+(x.tipe==='setor'?n:-n);
    },0);
  }
  const nm=U.santri.find(x=>x.id==s)?.nama||'';
  let h=st?`<div class="card"><label style="margin-top:0">Pilih santri</label><select id="tb_sel" style="width:100%" onchange="U.ts=+this.value;draw()">${opts(false,s)}</select><div class="srwrap"><button type="button" class="sec srbtn" onclick="srOpen('tb_sel','Cari santri untuk tabungan')"><i class="fa-solid fa-magnifying-glass"></i> Cari santri…</button></div></div>`:'';
  h+=`<div class="card" style="background:linear-gradient(135deg,#064e3b,#047857);color:#fff"><div style="font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.06em">${CHEST_SVG(20)} Saldo tabungan${st?' · '+esc(nm):''}</div><div style="font-size:28px;font-weight:800;margin-top:4px">${rp(sd)}</div><div style="font-size:12px;opacity:.85;margin-top:4px">Tabungan terpisah dari coin uang saku dan dikelola pengurus/admin.</div></div>`;
  if(st)h+=`<div class="card"><h3>Catat transaksi tabungan</h3><label>Jenis</label><select id="tb_j" style="width:100%"><option value="setor">Setor tabungan (+)</option><option value="tarik">Tarik tabungan (−)</option></select><label>Nominal (Rp)</label><input id="tb_n" type="number" min="1" style="width:100%"><label>Keterangan</label><input id="tb_k" style="width:100%" placeholder="Contoh: setoran bulanan, beli kitab"><p><button onclick="catatTabungan()">Simpan</button></p></div>`;
  return h+`<div class="card"><h3>Riwayat tabungan</h3>`+(tx.length?tx.map(x=>`<div class="li"><span>${esc(x.ket||(x.tipe=='setor'?'Setor tabungan':'Tarik tabungan'))}<div class="mu">${tglTb(x)?fdt(tglTb(x)):''}</div></span><b style="color:${x.tipe=='setor'?'var(--ok)':'var(--rd)'}">${x.tipe=='setor'?'+':'-'}${rp(x.jumlah)}</b></div>`).join(''):(errTb?`<div class="mu" style="color:var(--rd)">Riwayat gagal dimuat: ${esc(errTb)}</div>`:'<div class="mu">Belum ada transaksi tabungan untuk santri ini.</div>'))+'</div>';
};
async function catatTabungan(){const n=+$('tb_n').value;if(n<1)return msgBox('Isi nominal.');const j=$('tb_j').value,{data,error}=await SB.rpc('tabungan_catat',{p_santri:U.ts,p_tipe:j,p_jumlah:n,p_ket:$('tb_k').value.trim()||(j=='setor'?'Setor tabungan':'Tarik tabungan')});if(error)return msgBox(error.message);toast('Saldo tabungan: '+rp(data));draw()}

/* ===== Status Online Real-time & Menu Pengguna Aktif (Khusus Admin) ===== */
async function ensureRealtime(){
  if(!U.me||!U.me.id)return null;
  if(U._presCh&&U._rtReady)return U._presCh;
  if(U._rtConnecting&&U._presCh){
    // tunggu subscribe yang sedang berjalan
    for(let i=0;i<40&&!U._rtReady;i++)await new Promise(r=>setTimeout(r,100));
    return U._presCh;
  }
  return startRealtimePresence();
}

function startRealtimePresence(){
  if(!U.me||!U.me.id)return null;
  if(U._presCh){try{SB.removeChannel(U._presCh)}catch(e){}U._presCh=null}
  if(U._notifCh){try{SB.removeChannel(U._notifCh)}catch(e){}U._notifCh=null}
  U._rtReady=false;
  U._rtConnecting=true;U._rtT=Date.now();

  const ch=SB.channel('santritrack-online',{
    config:{
      presence:{key:String(U.me.id)},
      broadcast:{self:false,ack:false}
    }
  });
  ch.on('presence',{event:'sync'},()=>{
    const st=ch.presenceState(),on={};
    Object.entries(st).forEach(([k,arr])=>{
      const info=(arr&&arr[0])||{};
      on[k]={id:k,nama:info.nama||k,role:info.role||'',is_utama:!!info.is_utama,at:info.at||''};
    });
    U.online=on;
    if(U.tab==='penggunaaktif'){if(window.paRefresh)paRefresh()}
    else if(U.tab==='akun'||U.tab==='chat'){
      const el=$('online_refresh');if(el)el.click();
    }
  });
  ch.on('broadcast',{event:'chat-msg'},({payload})=>{
    if(!payload||!payload.to||!payload.msg)return;
    if(String(payload.to)!==String(U.me.id))return;
    appendIncomingChat(payload.from,payload.msg).catch(()=>{});
    if(U.tab==='chat'&&String(U.chatPeer?.id)===String(payload.from)){
      // soft refresh pesan tanpa reset fokus total
      muatPesanThread(payload.from).then(msgs=>{
        const box=$('chat_msgs');
        if(!box){bukaChatDengan(payload.from,payload.fromNama,payload.fromRole,true);return}
        box.dataset.cnt=String(msgs.length);
        box.innerHTML=msgs.length?msgs.map(m=>{
          if(m.type==='system'||m.clear)return '';
          const me=String(m.from)===String(U.me.id);
          const tm=m.waktu?new Date(m.waktu).toTimeString().slice(0,5):'';
          let body='';
          if(m.type==='foto'&&m.url)body=`<img src="${esc(m.url)}" alt="Gambar" onclick="window.open('${esc(m.url)}','_blank')">${m.text?`<div style="margin-top:4px">${esc(m.text)}</div>`:''}`;
          else if(m.type==='vn'&&m.url)body=`<audio controls src="${esc(m.url)}"></audio>`;
          else body=`<div style="white-space:pre-wrap">${esc(m.text||'')}</div>`;
          return `<div class="cbub ${me?'me':'ot'}">${body}<div class="ctm">${tm}</div></div>`;
        }).join(''):'<div class="mu" style="text-align:center;margin:auto">Belum ada pesan.</div>';
        box.scrollTop=box.scrollHeight;
      }).catch(()=>bukaChatDengan(payload.from,payload.fromNama,payload.fromRole,true));
    }else{
      const cd=$('cdot');if(cd)cd.style.display='';
      playNotifSound();
      toast('Pesan baru dari '+(payload.fromNama||'Pengguna'),{ms:4500});
    }
  });
  ch.on('broadcast',{event:'call-sig'},({payload})=>{
    if(!payload||String(payload.to)!==String(U.me.id))return;
    handleIncomingCallSignal(payload);
  });
  ch.on('broadcast',{event:'app-notif'},({payload})=>{
    if(!payload||String(payload.to)!==String(U.me.id))return;
    const nid=payload.id||(payload.at+'_'+(payload.judul||payload.pesan||'').slice(0,24));
    U._seenNotif=U._seenNotif||new Set();
    if(U._seenNotif.has(nid))return;
    U._seenNotif.add(nid);
    if(U._seenNotif.size>80){U._seenNotif=new Set([...U._seenNotif].slice(-40))}
    onRealtimeNotif(payload);
  });
  ch.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      U._rtReady=true;
      U._rtConnecting=false;
      try{
        await ch.track({id:String(U.me.id),nama:U.me.nama,role:U.me.role,is_utama:isAdminUtama(),at:new Date().toISOString()});
      }catch(e){}
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
      U._rtReady=false;
      U._rtConnecting=false;
      // auto-reconnect once after delay
      clearTimeout(U._rtRetry);
      U._rtRetry=setTimeout(()=>{if(U.me&&U.me.id)startRealtimePresence()},2500);
    }
  });
  U._presCh=ch;

  if(U.me.role==='wali'){
    const nch=SB.channel('notif-wali-'+U.me.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifikasi'},payload=>{
        const row=payload.new||{};
        const nid='db_'+row.id;
        U._seenNotif=U._seenNotif||new Set();
        if(U._seenNotif.has(nid))return;
        U._seenNotif.add(nid);
        onRealtimeNotif({id:nid,jenis:row.jenis,judul:row.jenis,pesan:row.pesan,santri_nama:row.santri_nama||''});
      })
      .subscribe();
    U._notifCh=nch;
  }
  return ch;
}

async function rtSend(event,payload){
  const ch=await ensureRealtime();
  if(!ch)throw new Error('Koneksi real-time belum siap. Coba lagi.');
  // tunggu ready max ~3 detik
  for(let i=0;i<30&&!U._rtReady;i++)await new Promise(r=>setTimeout(r,100));
  if(!U._rtReady){
    // coba kirim tetap (beberapa kasus channel sudah joined)
  }
  const{error}=await ch.send({type:'broadcast',event,payload});
  if(error)throw error;
}

/* ===== Obrolan Langsung (Chat), VN, Gambar 24 Jam, Panggilan Suara & Video Call ===== */
const CHAT_TTL=36e5; // 1 jam dalam milidetik
const chatThreadKey=(a,b)=>'chat_'+[String(a),String(b)].sort().join('__');

async function getChatContacts(){
  const role=U.me.role;
  const contacts=[];
  const seen=new Set();
  const addC=c=>{if(c&&c.id&&String(c.id)!==String(U.me.id)&&!seen.has(String(c.id))){seen.add(String(c.id));contacts.push(c)}};

  let profs=[];
  try{profs=ok(await SB.from('profiles').select('id,nama,role,no_hp,is_utama').order('nama'))||[]}catch(e){}
  if(!profs.length){
    try{
      const{data}=await SB.from('konten').select('nilai').eq('kunci','admin_kontak').maybeSingle();
      if(data&&Array.isArray(data.nilai))profs=data.nilai;
    }catch(e){}
  }

  let alumniList=[];
  try{
    let raw=(U.allSantri&&U.allSantri.length)?U.allSantri:[];
    if(!raw.length){try{raw=ok(await SB.from('santri').select('id,nama,nis,angkatan,alumni').order('nama'))||[]}catch(e){raw=[]}}
    if(!raw.length){
      try{
        const{data}=await SB.from('konten').select('nilai').eq('kunci','alumni_kontak').maybeSingle();
        if(data&&Array.isArray(data.nilai))raw=data.nilai.map(x=>({...x,alumni:true}));
      }catch(e){}
    }
    if(!raw.length&&role==='alumni'){
      try{
        const nis=(U.alumni&&U.alumni.nis)||'';
        const{data}=await SB.rpc('daftar_alumni_publik',{p_nis:nis});
        if(Array.isArray(data))raw=data.map(x=>({...x,alumni:true}));
      }catch(e){}
    }
    alumniList=raw.filter(x=>x.alumni).map(x=>({
      id:x.id?('alumni-'+x.id):('alumni-nis-'+String(x.nis||x.nama)),
      nama:x.nama,
      role:'alumni',
      sub:'Alumni'+(x.angkatan?' · Angkatan '+x.angkatan:'')
    }));
  }catch(e){}

  // Tidak ada batasan interaksi: admin/pengurus bisa chat semua; wali & alumni ke admin + peer yang relevan
  const roleLbl=p=>{
    if(p.role==='admin')return isAdminUtama(p)?'Admin Utama':'Anggota Admin';
    if(p.role==='wali')return 'Wali Santri'+(p.no_hp?' · '+p.no_hp:'');
    if(p.role==='pengurus')return 'Pengurus';
    if(p.role==='alumni')return 'Alumni';
    return p.role||'Pengguna';
  };

  if(role==='admin'||role==='pengurus'){
    // Semua profil (admin, wali, pengurus) + semua alumni + yang sedang online
    profs.forEach(p=>addC({id:p.id,nama:p.nama,role:p.role,sub:roleLbl(p)}));
    alumniList.forEach(a=>addC(a));
    Object.values(U.online||{}).forEach(o=>{
      addC({id:o.id,nama:o.nama,role:o.role,sub:roleLbl(o)+(o.role==='alumni'?'':' · Online')});
    });
  }else if(role==='wali'){
    profs.filter(p=>p.role==='admin'||p.role==='pengurus').forEach(p=>addC({id:p.id,nama:p.nama,role:p.role,sub:roleLbl(p)}));
    Object.values(U.online||{}).filter(x=>x.role==='admin'||x.role==='pengurus').forEach(p=>{
      addC({id:p.id,nama:p.nama,role:p.role,sub:roleLbl(p)});
    });
  }else if(role==='alumni'){
    profs.filter(p=>p.role==='admin'||p.role==='pengurus').forEach(p=>addC({id:p.id,nama:p.nama,role:p.role,sub:roleLbl(p)}));
    Object.values(U.online||{}).filter(x=>x.role==='admin'||x.role==='pengurus').forEach(p=>{
      addC({id:p.id,nama:p.nama,role:p.role,sub:roleLbl(p)});
    });
    alumniList.forEach(a=>addC(a));
    Object.values(U.online||{}).filter(x=>x.role==='alumni').forEach(a=>{
      addC({id:a.id,nama:a.nama,role:'alumni',sub:'Alumni'});
    });
  }
  // Sort: online first, then by name
  contacts.sort((a,b)=>{
    const ao=!!U.online[a.id],bo=!!U.online[b.id];
    if(ao!==bo)return ao?-1:1;
    return String(a.nama||'').localeCompare(String(b.nama||''),'id');
  });
  return contacts;
}

function chatLocalKey(key){return 'st_chat_'+key}
function loadLocalChat(key){
  try{const r=JSON.parse(localStorage.getItem(chatLocalKey(key))||'[]');return Array.isArray(r)?r:[]}catch(e){return []}
}
function saveLocalChat(key,msgs){
  try{localStorage.setItem(chatLocalKey(key),JSON.stringify(msgs.slice(-150)))}catch(e){}
}
function mergeChatMsgs(a,b){
  const map=new Map();
  [...(a||[]),...(b||[])].forEach(m=>{
    if(!m)return;
    const k=m.id||((m.waktu||'')+'_'+(m.from||'')+'_'+(m.text||m.url||'').slice(0,40));
    if(!map.has(k))map.set(k,m);
  });
  return [...map.values()].sort((x,y)=>new Date(x.waktu||0)-new Date(y.waktu||0));
}
function pruneChatMsgs(msgs){
  const now=Date.now();
  return (msgs||[]).filter(m=>!m.waktu||(now-new Date(m.waktu).getTime()<CHAT_TTL)).slice(-150);
}

async function muatPesanThread(peerId){
  const key=chatThreadKey(U.me.id,peerId);
  let remote=[];
  try{
    const{data}=await SB.from('konten').select('nilai').eq('kunci',key).maybeSingle();
    if(data&&Array.isArray(data.nilai))remote=data.nilai;
  }catch(e){}
  const local=loadLocalChat(key);
  let valid=pruneChatMsgs(mergeChatMsgs(remote,local));
  // Keep local in sync
  saveLocalChat(key,valid);
  // Try clean remote if we have auth (non-alumni)
  if(U.me.role!=='alumni'&&remote.length!==valid.length){
    try{await SB.from('konten').upsert({kunci:key,nilai:valid,diubah:new Date().toISOString()})}catch(e){}
  }
  return valid;
}

async function simpanPesanThread(peerId,msgObj){
  const key=chatThreadKey(U.me.id,peerId);
  const valid=await muatPesanThread(peerId);
  if(!(msgObj.id&&valid.some(m=>m.id===msgObj.id)))valid.push(msgObj);
  const trimmed=pruneChatMsgs(valid);
  saveLocalChat(key,trimmed);
  // Simpan ke cloud (opsional, jangan blokir)
  try{await SB.from('konten').upsert({kunci:key,nilai:trimmed,diubah:new Date().toISOString()})}catch(e){}
  // Broadcast wajib untuk real-time
  try{
    await rtSend('chat-msg',{from:String(U.me.id),fromNama:U.me.nama,fromRole:U.me.role,to:String(peerId),msg:msgObj});
  }catch(e){
    // tetap sukses lokal; lawan bisa load dari cloud nanti
    console.warn('broadcast chat gagal',e);
  }
  return trimmed;
}

async function hapusSemuaPesanChat(){
  if(!U.chatPeer)return;
  uiConfirm('Hapus semua pesan di percakapan ini?',async()=>{
    const peerId=U.chatPeer.id;
    const key=chatThreadKey(U.me.id,peerId);
    saveLocalChat(key,[]);
    try{await SB.from('konten').upsert({kunci:key,nilai:[],diubah:new Date().toISOString()})}catch(e){}
    try{await SB.from('konten').delete().eq('kunci',key)}catch(e){}
    rtSend('chat-msg',{from:String(U.me.id),fromNama:U.me.nama,fromRole:U.me.role,to:String(peerId),msg:{id:'clr-'+Date.now(),from:String(U.me.id),type:'system',text:'',waktu:new Date().toISOString(),clear:true}}).catch(()=>{});
    toast('Semua pesan dihapus.');
    draw();
  },'Hapus semua pesan');
}

async function appendIncomingChat(fromId,msgObj){
  if(!msgObj)return;
  const key=chatThreadKey(U.me.id,fromId);
  if(msgObj.clear){
    saveLocalChat(key,[]);
    try{await SB.from('konten').upsert({kunci:key,nilai:[],diubah:new Date().toISOString()})}catch(e){}
    if(U.tab==='chat'&&String(U.chatPeer?.id)===String(fromId))draw();
    return [];
  }
  const valid=await muatPesanThread(fromId);
  if(msgObj.id&&valid.some(m=>m.id===msgObj.id))return valid;
  valid.push(msgObj);
  const trimmed=pruneChatMsgs(valid);
  saveLocalChat(key,trimmed);
  try{await SB.from('konten').upsert({kunci:key,nilai:trimmed,diubah:new Date().toISOString()})}catch(e){}
  return trimmed;
}

function mulaiPollChat(){
  clearInterval(U._chatPoll);
  U._chatPoll=setInterval(async()=>{
    if(U.tab!=='chat'||!U.chatPeer){clearInterval(U._chatPoll);U._chatPoll=null;return}
    try{
      const msgs=await muatPesanThread(U.chatPeer.id);
      const box=$('chat_msgs');
      if(box&&Number(box.dataset.cnt||0)!==msgs.length){
        draw();
      }
    }catch(e){}
  },4000);
}
