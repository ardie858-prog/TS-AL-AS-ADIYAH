/* ---- Voice Note (VN) ---- */
let VN_REC=null,VN_CHUNKS=[],VN_STREAM=null,VN_MIME='';
function mediaErr(e){
  const m=String(e&&e.message||e||'');
  if(/NotAllowed|Permission|denied/i.test(m))return 'Izin mikrofon/kamera ditolak. Aktifkan di pengaturan browser.';
  if(/NotFound|DevicesNotFound/i.test(m))return 'Mikrofon/kamera tidak ditemukan.';
  if(/secure|HTTPS|getUserMedia/i.test(m))return 'Fitur ini membutuhkan HTTPS.';
  return m||'Perangkat media tidak dapat diakses.';
}
async function toggleRekamVN(){
  if(!U.chatPeer)return msgBox('Pilih kontak chat terlebih dahulu.');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msgBox('Browser tidak mendukung rekaman suara. Gunakan Chrome/Safari terbaru (HTTPS).');
  const btn=$('vn_btn');
  if(VN_REC&&VN_REC.state==='recording'){
    try{VN_REC.requestData&&VN_REC.requestData()}catch(e){}
    VN_REC.stop();
    if(btn)btn.classList.remove('rec');
    return;
  }
  try{
    await ensureRealtime();
    VN_STREAM=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    VN_CHUNKS=[];
    VN_MIME=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus'
      :(MediaRecorder.isTypeSupported('audio/webm')?'audio/webm'
      :(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':''));
    VN_REC=VN_MIME?new MediaRecorder(VN_STREAM,{mimeType:VN_MIME}):new MediaRecorder(VN_STREAM);
    VN_REC.ondataavailable=e=>{if(e.data&&e.data.size>0)VN_CHUNKS.push(e.data)};
    VN_REC.onerror=e=>msgBox('Kesalahan rekaman: '+mediaErr(e.error||e));
    VN_REC.onstop=async()=>{
      try{if(VN_STREAM)VN_STREAM.getTracks().forEach(t=>t.stop())}catch(e){}
      VN_STREAM=null;
      if(!VN_CHUNKS.length){msgBox('Rekaman kosong. Coba lagi.');return}
      try{
        toast('Mengirim pesan suara…');
        const type=VN_MIME||'audio/webm';
        const ext=type.includes('mp4')?'m4a':'webm';
        const bl=new Blob(VN_CHUNKS,{type});
        const path='chat24/vn-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.'+ext;
        let url='',savedPath=null;
        try{
          const up=await SB.storage.from('story').upload(path,bl,{contentType:type,upsert:false});
          if(up.error)throw up.error;
          url=SB.storage.from('story').getPublicUrl(path).data.publicUrl;
          savedPath=path;
        }catch(upErr){
          url=await blobToDataUrl(bl);
        }
        await simpanPesanThread(U.chatPeer.id,{id:Date.now(),from:String(U.me.id),type:'vn',url,path:savedPath,waktu:new Date().toISOString()});
        draw();
      }catch(err){msgBox('Gagal mengirim VN: '+mediaErr(err))}
    };
    VN_REC.start(250);
    if(btn)btn.classList.add('rec');
    toast('Merekam… Ketuk mikrofon lagi untuk kirim.');
  }catch(e){msgBox(mediaErr(e))}
}

/* ---- Panggilan Suara & Video Call (WebRTC dioptimalkan) ---- */
let CALL={
  pc:null,localStream:null,remoteStream:null,peerId:null,peerName:'',mode:'video',
  timer:null,sec:0,pendingIce:[],makingOffer:false,ignoreOffer:false,isCaller:false,
  polite:false,camFront:true,statsTimer:null,restarting:false,iceSeen:new Set()
};
// STUN + TURN publik (Open Relay) agar lolos NAT/firewall ketat
const ICE_SERVERS=[
  {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},
  {urls:'stun:stun.cloudflare.com:3478'},
  {urls:'stun:stun.relay.metered.ca:80'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turns:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}
];
const PC_CONFIG={
  iceServers:ICE_SERVERS,
  iceCandidatePoolSize:16,
  iceTransportPolicy:'all',
  bundlePolicy:'max-bundle',
  rtcpMuxPolicy:'require'
};
const AUDIO_CONSTRAINTS={
  echoCancellation:true,noiseSuppression:true,autoGainControl:true,
  channelCount:1,sampleRate:{ideal:48000}
};
function videoConstraints(front){
  return {
    facingMode:front?'user':'environment',
    width:{ideal:640,max:1280},height:{ideal:480,max:720},
    frameRate:{ideal:24,max:30}
  };
}
function sendCallSignal(to,data){
  if(!to)return;
  rtSend('call-sig',{from:String(U.me.id),fromNama:U.me.nama,to:String(to),...data})
    .catch(e=>console.warn('call signal',e));
}
function setCallStatus(txt){const el=$('call_st');if(el)el.textContent=txt}
function startCallTimer(){
  if(CALL.timer)return;
  CALL.sec=0;
  CALL.timer=setInterval(()=>{
    CALL.sec++;
    const m=String(Math.floor(CALL.sec/60)).padStart(2,'0'),s=String(CALL.sec%60).padStart(2,'0');
    setCallStatus(m+':'+s);
  },1000);
}
function showCallOverlay(name,mode,statusTxt,incoming){

      <div id="call_st" style="font-size:13px;color:#a7f3d0;margin-top:4px">${esc(statusTxt)}</div>
      <div id="call_net" style="font-size:11px;color:#6ee7b7;margin-top:2px;opacity:.85"></div>

    <div class="call-vids" style="${isVid?'':'background:radial-gradient(circle,#065f46,#021a14)'}">

        ?`<video id="remVid" autoplay playsinline style="width:100%;height:100%;object-fit:cover;background:#021a14"></video>
          <video id="locVid" autoplay muted playsinline style="position:absolute;right:12px;bottom:12px;width:104px;height:142px;object-fit:cover;border-radius:12px;border:2px solid #34d399;background:#000"></video>`

          <audio id="remAud" autoplay playsinline></audio>`}

    <div class="call-ctrls" id="call_ctrls">
      ${incoming
        ?`<button type="button" style="background:#10b981;color:#fff" onclick="terimaPanggilan()" title="Terima"><i class="fa-solid fa-phone"></i></button>
          <button type="button" class="dn" onclick="akhiriPanggilan(true)" title="Tolak"><i class="fa-solid fa-phone-slash"></i></button>`
        :`<button type="button" class="sec" id="mute_btn" onclick="toggleMuteCall()" title="Mikrofon"><i class="fa-solid fa-microphone"></i></button>

async function getCallMedia(mode,front){
  const audio=AUDIO_CONSTRAINTS;
  if(mode==='audio')return navigator.mediaDevices.getUserMedia({audio,video:false});
  try{
    return await navigator.mediaDevices.getUserMedia({audio,video:videoConstraints(front!==false)});
  }catch(e){
    // fallback resolusi lebih rendah
    return navigator.mediaDevices.getUserMedia({audio,video:{facingMode:front!==false?'user':'environment',width:{ideal:320},height:{ideal:240}}});
  }
}
async function applySenderParams(pc){
  try{
    for(const sender of pc.getSenders()){
      if(!sender.track)continue;
      const p=sender.getParameters();
      if(!p.encodings||!p.encodings.length)p.encodings=[{}];
      if(sender.track.kind==='video'){
        p.encodings[0].maxBitrate=600000; // ~600 kbps
        p.encodings[0].maxFramerate=24;
        p.degradationPreference='maintain-framerate';
      }else if(sender.track.kind==='audio'){
        p.encodings[0].maxBitrate=48000;
      }
      await sender.setParameters(p).catch(()=>{});
    }
  }catch(e){}
}
async function flushPendingIce(pc){
  const q=CALL.pendingIce.splice(0);
  for(const c of q){
    try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){}
  }
}
function attachRemoteStream(stream){
  CALL.remoteStream=stream;
  const rv=$('remVid'),ra=$('remAud');
  if(rv){rv.srcObject=stream;rv.setAttribute('playsinline','');rv.play().catch(()=>{})}
  if(ra){ra.srcObject=stream;ra.play().catch(()=>{})}
  startCallTimer();
}
function startCallStats(pc){
  clearInterval(CALL.statsTimer);
  CALL.statsTimer=setInterval(async()=>{
    if(!pc||pc.connectionState==='closed')return;
    try{
      const stats=await pc.getStats();
      let rtt=null,loss=null,bit=null;
      stats.forEach(r=>{
        if(r.type==='candidate-pair'&&r.state==='succeeded'){
          if(r.currentRoundTripTime!=null)rtt=Math.round(r.currentRoundTripTime*1000);
        }
        if(r.type==='inbound-rtp'&&!r.isRemote){
          if(r.packetsLost!=null&&r.packetsReceived!=null){
            const t=(r.packetsLost+r.packetsReceived)||1;
            loss=Math.round((r.packetsLost/t)*100);
          }
          if(r.bytesReceived!=null&&r.timestamp)bit=r;
        }
      });
      const net=$('call_net');
      if(net){
        const parts=[];
        if(rtt!=null)parts.push(rtt+' ms');
        if(loss!=null)parts.push('loss '+loss+'%');
        net.textContent=parts.join(' · ');
      }
    }catch(e){}
  },3000);
}
async function setupPeerConnection(peerId,mode,{isCaller}={}){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    throw new Error('Browser tidak mendukung panggilan. Gunakan HTTPS + Chrome/Safari.');
  // tutup PC lama jika ada
  if(CALL.pc){try{CALL.pc.close()}catch(e){}}
  const pc=new RTCPeerConnection(PC_CONFIG);
  CALL.pc=pc;
  CALL.peerId=String(peerId);
  CALL.mode=mode;
  CALL.pendingIce=[];
  CALL.iceSeen=new Set();
  CALL.makingOffer=false;
  CALL.ignoreOffer=false;
  CALL.isCaller=!!isCaller;
  // polite peer = yang ID-nya lebih kecil (hindari glare)
  CALL.polite=String(U.me.id)<String(peerId);

  const st=await getCallMedia(mode,CALL.camFront);
  CALL.localStream=st;
  // Transceiver explicit agar arah media jelas
  if(mode==='audio'){
    pc.addTransceiver('audio',{direction:'sendrecv'});
  }else{
    pc.addTransceiver('audio',{direction:'sendrecv'});
    pc.addTransceiver('video',{direction:'sendrecv'});
  }
  st.getTracks().forEach(tr=>{
    const sender=pc.getSenders().find(s=>s.track&&s.track.kind===tr.kind);
    if(sender)sender.replaceTrack(tr).catch(()=>pc.addTrack(tr,st));
    else pc.addTrack(tr,st);
  });
  await applySenderParams(pc);

  const lv=$('locVid');
  if(lv){lv.srcObject=st;lv.muted=true;lv.setAttribute('playsinline','');lv.play().catch(()=>{})}

  pc.ontrack=ev=>{
    const stream=ev.streams&&ev.streams[0]||new MediaStream([ev.track]);
    if(!CALL.remoteStream){
      attachRemoteStream(stream);
    }else{
      // tambah track ke stream yang sama
      const exists=CALL.remoteStream.getTracks().some(t=>t.id===ev.track.id);
      if(!exists)CALL.remoteStream.addTrack(ev.track);
      attachRemoteStream(CALL.remoteStream);
    }
  };

  pc.onicecandidate=ev=>{
    if(!ev.candidate)return;
    const key=ev.candidate.candidate||JSON.stringify(ev.candidate);
    if(CALL.iceSeen.has(key))return;
    CALL.iceSeen.add(key);
    sendCallSignal(peerId,{sig:'ice',candidate:ev.candidate.toJSON?ev.candidate.toJSON():ev.candidate});
  };

  pc.oniceconnectionstatechange=()=>{
    const s=pc.iceConnectionState;
    if(s==='connected'||s==='completed'){
      setCallStatus(CALL.timer?undefined: 'Terhubung');
      if(!CALL.timer)startCallTimer();
      CALL.restarting=false;
    }else if(s==='checking')setCallStatus('Menghubungkan…');
    else if(s==='disconnected')setCallStatus('Koneksi lemah…');
    else if(s==='failed'){
      setCallStatus('Gagal — mencoba ulang…');
      tryIceRestart();
    }
  };
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==='connected'){startCallTimer();startCallStats(pc)}
    else if(s==='failed')tryIceRestart();
  };
  pc.onnegotiationneeded=async()=>{
    try{
      CALL.makingOffer=true;
      const offer=await pc.createOffer();
      if(pc.signalingState!=='stable')return;
      await pc.setLocalDescription(offer);
      sendCallSignal(peerId,{sig:'offer',mode:CALL.mode,sdp:pc.localDescription});
    }catch(e){console.warn('negotiation',e)}
    finally{CALL.makingOffer=false}
  };
  return pc;
}
async function tryIceRestart(){
  if(!CALL.pc||CALL.restarting||!CALL.peerId)return;
  CALL.restarting=true;
  try{
    const offer=await CALL.pc.createOffer({iceRestart:true});
    await CALL.pc.setLocalDescription(offer);
    sendCallSignal(CALL.peerId,{sig:'offer',mode:CALL.mode,sdp:CALL.pc.localDescription,restart:true});
  }catch(e){
    CALL.restarting=false;
    setCallStatus('Koneksi gagal');
  }
}
async function mulaiPanggilan(mode){
  if(!U.chatPeer)return msgBox('Pilih kontak chat terlebih dahulu.');
  if(CALL.pc)akhiriPanggilan(false);
  const p=U.chatPeer;
  CALL.peerName=p.nama;
  CALL.camFront=true;
  showCallOverlay(p.nama,mode,'Menghubungi…',false);
  try{
    await ensureRealtime();
    const pc=await setupPeerConnection(p.id,mode,{isCaller:true});
    CALL.makingOffer=true;
    const offer=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:mode!=='audio'});
    await pc.setLocalDescription(offer);
    CALL.makingOffer=false;
    sendCallSignal(p.id,{sig:'offer',mode,sdp:pc.localDescription});
    // timeout ring 45 detik
    clearTimeout(CALL.ringTimer);
    CALL.ringTimer=setTimeout(()=>{
      if(CALL.pc&&!CALL.timer){toast('Tidak terjawab.');akhiriPanggilan(true)}
    },45000);
  }catch(e){akhiriPanggilan(false);msgBox('Gagal memulai panggilan: '+mediaErr(e))}
}
let PENDING_OFFER=null;
async function handleIncomingCallSignal(payload){
  try{
    if(payload.sig==='offer'){
      const pc=CALL.pc;
      // Perfect negotiation: hindari glare
      const offerCollision=CALL.makingOffer||(pc&&pc.signalingState!=='stable');
      CALL.ignoreOffer=!CALL.polite&&offerCollision&&!payload.restart;
      if(CALL.ignoreOffer)return;

      if(!pc||payload.restart){
        // panggilan baru / ice restart dari lawan
        if(!pc){
          PENDING_OFFER=payload;
          CALL.peerId=String(payload.from);
          CALL.peerName=payload.fromNama||'Pengguna';
          CALL.mode=payload.mode||'video';
          showCallOverlay(CALL.peerName,CALL.mode,'Panggilan masuk…',true);
          playNotifSound();
          return;
        }
      }
      if(pc){
        if(offerCollision){
          await pc.setLocalDescription({type:'rollback'}).catch(()=>{});
        }
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        await flushPendingIce(pc);
        const ans=await pc.createAnswer();
        await pc.setLocalDescription(ans);
        sendCallSignal(payload.from,{sig:'answer',sdp:pc.localDescription});
      }else{
        PENDING_OFFER=payload;
      }
    }else if(payload.sig==='answer'){
      if(CALL.pc&&!CALL.pc.currentRemoteDescription){
        await CALL.pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        await flushPendingIce(CALL.pc);
        clearTimeout(CALL.ringTimer);
      }
    }else if(payload.sig==='ice'&&payload.candidate){
      const key=(payload.candidate.candidate)||JSON.stringify(payload.candidate);
      if(CALL.iceSeen.has(key))return;
      CALL.iceSeen.add(key);
      if(CALL.pc&&CALL.pc.remoteDescription){
        try{await CALL.pc.addIceCandidate(new RTCIceCandidate(payload.candidate))}catch(e){}
      }else{
        CALL.pendingIce.push(payload.candidate);
      }
    }else if(payload.sig==='end'){
      akhiriPanggilan(false);toast('Panggilan berakhir.');
    }
  }catch(e){console.warn('call signal handle',e)}
}
async function terimaPanggilan(){
  if(!PENDING_OFFER)return;
  const off=PENDING_OFFER;PENDING_OFFER=null;
  showCallOverlay(CALL.peerName,CALL.mode,'Menyambungkan…',false);
  try{
    await ensureRealtime();
    const pc=await setupPeerConnection(off.from,off.mode||'video',{isCaller:false});
    await pc.setRemoteDescription(new RTCSessionDescription(off.sdp));
    await flushPendingIce(pc);
    const ans=await pc.createAnswer();
    await pc.setLocalDescription(ans);
    sendCallSignal(off.from,{sig:'answer',sdp:pc.localDescription});
  }catch(e){akhiriPanggilan(true);msgBox('Gagal menerima panggilan: '+mediaErr(e))}
}

const BK_VER=1;
const BK_TABLES=['santri','profiles','wali_santri','pelanggaran','sanksi_santri','tagihan','izin','acara','pengumuman','story','wa_antrian','notifikasi','konten','pendaftar','transaksi','topup_request','kesehatan','tabungan'];

async function kumpulDataBackup(){
  const tables={},errs={};
  for(const t of BK_TABLES){
    try{
      const r=await SB.from(t).select('*').limit(10000);
      if(r.error)errs[t]=r.error.message;
      else tables[t]=r.data||[];
    }catch(e){errs[t]=e.message}
  }
  return {app:'SantriTrack',lembaga:'PPP. AL-AS’ADIYAH',versi:BK_VER,dibuat:new Date().toISOString(),oleh:U.me?.nama||'admin',tables,errs};
}
function strToGz(str){
  const bytes=new TextEncoder().encode(str);
  if(typeof CompressionStream==='function'){
    const cs=new CompressionStream('gzip');
    const w=cs.writable.getWriter();w.write(bytes);w.close();
    return new Response(cs.readable).blob();
  }
  return Promise.resolve(new Blob([bytes],{type:'application/json'}));
}
async function gzToStr(blob){
  const buf=await blob.arrayBuffer();
  const u8=new Uint8Array(buf);
  if(u8[0]===0x1f&&u8[1]===0x8b&&typeof DecompressionStream==='function'){
    const ds=new DecompressionStream('gzip');
    const w=ds.writable.getWriter();w.write(buf);w.close();
    return await new Response(ds.readable).text();
  }
  return new TextDecoder().decode(u8);
}

async function buatCadanganCloud(silent){
  if(!U.me||U.me.role!=='admin')return;
  try{
    if(!silent)toast('Membuat cadangan data ke cloud…');
    const payload=await kumpulDataBackup();
    const json=JSON.stringify(payload);
    const gz=await strToGz(json);
    const isGz=typeof CompressionStream==='function';
    const tgl=new Date().toISOString().slice(0,10);
    const path='backups/backup-'+tgl+'-'+Date.now()+(isGz?'.json.gz':'.json');
    const up=await SB.storage.from('bukti').upload(path,gz,{upsert:true,contentType:isGz?'application/gzip':'application/json'});
    if(up.error)throw up.error;
    const ls=await SB.storage.from('bukti').list('backups',{limit:100});
    const files=(ls.data||[]).filter(x=>x.name&&x.name.startsWith('backup-')).sort((a,b)=>b.name.localeCompare(a.name));
    if(files.length>30){
      const old=files.slice(30).map(x=>'backups/'+x.name);
      await SB.storage.from('bukti').remove(old);
    }
    localStorage.setItem('st_last_bk',tgl);
    if(!silent){toast('Cadangan berhasil disimpan ke cloud.');draw()}
  }catch(e){if(!silent)msgBox('Gagal membuat cadangan: '+e.message)}
}

  if(!U.me||U.me.role!=='admin')return;
  const tgl=new Date().toISOString().slice(0,10);

  try{
    const ls=await SB.storage.from('bukti').list('backups',{limit:20});

async function prosesPulihkanJson(txt){
  let obj;
  try{obj=JSON.parse(txt)}catch(e){return msgBox('Format file cadangan tidak valid (bukan JSON).')}
  if(!obj||obj.app!=='SantriTrack'||!obj.tables)return msgBox('File ini bukan cadangan aplikasi SantriTrack.');
  const tgl=obj.dibuat?fdt(obj.dibuat):'-';
  const jmlSantri=(obj.tables.santri||[]).length;
  uiConfirm(`Pulihkan seluruh data dari cadangan tanggal ${tgl} (${jmlSantri} data santri)? Data saat ini akan diperbarui sesuai cadangan tersebut.`,async()=>{
    try{
      toast('Sedang memulihkan data, mohon tunggu…');
      const urutan=['konten','santri','profiles','wali_santri','pelanggaran','sanksi_santri','tagihan','izin','acara','pengumuman','story','wa_antrian','notifikasi','pendaftar','transaksi','topup_request','kesehatan','tabungan'];
      const konf={konten:'kunci'};
      let sukses=0,gagal=[];
      for(const t of urutan){
        const rows=obj.tables[t];
        if(!Array.isArray(rows)||!rows.length)continue;
        const onConflict=konf[t]||'id';
        for(let i=0;i<rows.length;i+=200){
          const chunk=rows.slice(i,i+200);
          const r=await SB.from(t).upsert(chunk,{onConflict});
          if(r.error){gagal.push(t+': '+r.error.message);break}
        }
        if(!gagal.some(x=>x.startsWith(t+':')))sukses++;
      }
      await reloadSantri();
      if(gagal.length)msgBox('Pemulihan selesai sebagian ('+sukses+' tabel). Kendala:\n'+gagal.join('\n'));
      else toast('Seluruh data berhasil dipulihkan ('+sukses+' tabel).');
      draw();
    }catch(e){msgBox('Gagal memulihkan: '+e.message)}
  },'Pulihkan Data Cadangan');
}

  try{

    if(r.error)throw r.error;
    const txt=await gzToStr(r.data);

<script id="fix-v9-js">
/* Penjaga status online: sambung ulang & daftar ulang kehadiran saat layar menyala / internet kembali / berkala */
(function(){
  function me(){return U&&U.me&&U.me.id&&!U.off}
  function tr(){
    if(!me()||!navigator.onLine)return;
    var ch=U._presCh;
    if(!ch||(ch.state!=='joined'&&!U._rtConnecting)||(U._rtConnecting&&Date.now()-(U._rtT||0)>12000)){try{startRealtimePresence()}catch(e){}return}
    if(ch.state==='joined'){try{ch.track({id:String(U.me.id),nama:U.me.nama,role:U.me.role,is_utama:isAdminUtama(),at:new Date().toISOString()})}catch(e){}}
  }
  setInterval(tr,20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)setTimeout(tr,300)});
  window.addEventListener('focus',function(){setTimeout(tr,300)});
  window.addEventListener('online',function(){setTimeout(tr,1000)});
  window.paRefresh=async function(manual){
    var w=$('pa_wrap');if(!w||!U||U.tab!=='penggunaaktif')return;
    if(manual)tr();
    try{var h=await R.penggunaaktif();var t=document.createElement('div');t.innerHTML=h;var n=t.querySelector('#pa_wrap');if(n&&$('pa_wrap'))$('pa_wrap').innerHTML=n.innerHTML}catch(e){}
  };
  setInterval(function(){if(U&&U.tab==='penggunaaktif'&&!document.hidden)paRefresh()},4000);
})();
</script>
